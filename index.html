<!doctype html>
<!--
  CloudLexis: a cross-cloud knowledge assistant for new solutions engineers
  ------------------------------------------------------------------------
  Single-file prototype. Open this file in any modern browser; no server,
  no install and no internet connection are needed.

  What runs for real in the browser:
    - tokenisation that keeps product codes (e.g. m5.2xlarge) in one piece
    - rule-based entity recognition (providers, services, SKUs, specs, regions)
    - entity linking to a cross-cloud glossary, with fuzzy matching for typos
    - query rewriting, BM25 keyword search, entity-based ranking and
      reciprocal rank fusion
    - document chunking, index-time entity tagging and PII redaction
    - spec matching for instance sizing and a small offline evaluation

  What is simulated:
    - the intent classifier is a keyword model standing in for DistilBERT
    - the answer text is built from retrieved sentences with templates;
      no large language model is called
    - dense (embedding) retrieval and the cross-encoder reranker are shown
      as planned steps only

  All data is synthetic. "Nimbus Cloud" is a fictional cloud provider.
  AWS, Microsoft Azure and Google Cloud product names are trademarks of their
  owners and appear only to show how terms map between providers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudLexis</title>
<meta name="description" content="Prototype of a cross-cloud knowledge assistant that helps new solutions engineers find answers in their company's own product terms.">

<style>
/* =====================================================================
   1. Design tokens (light theme first, dark theme below)
   ===================================================================== */
:root {
  color-scheme: light;
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #f0f3f1;
  --surface-3: #e7ece9;
  --border: #e0e5e2;
  --border-strong: #cdd5d0;
  --text: #17211d;
  --text-2: #46534d;
  --muted: #6b7872;
  --primary: #1f4d40;
  --primary-600: #2a6b59;
  --primary-50: #e7f1ed;
  --primary-ink: #ffffff;
  --accent: #b8305a;
  --accent-50: #fbe9ef;
  --ok: #24764f;
  --ok-50: #e3f3ea;
  --warn: #9a6200;
  --warn-50: #fdf1dc;
  --danger: #b42318;
  --danger-50: #fdecea;
  /* entity label colours (used for marks and chips) */
  --ent-provider: #3355c8;
  --ent-provider-bg: #e8edfc;
  --ent-service: #1f6b55;
  --ent-service-bg: #e1f2ec;
  --ent-sku: #b8305a;
  --ent-sku-bg: #fbe6ed;
  --ent-spec: #8a5a00;
  --ent-spec-bg: #fcefd6;
  --ent-region: #6a45d1;
  --ent-region-bg: #efe9fc;
  /* chart series (validated categorical pair) */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --shadow: 0 1px 2px rgba(16, 32, 26, .06), 0 1px 1px rgba(16, 32, 26, .04);
  --shadow-lg: 0 10px 30px rgba(16, 32, 26, .12);
  --radius: 12px;
  --radius-sm: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111614; --surface: #171d1a; --surface-2: #1d2420; --surface-3: #252e29;
    --border: #2a332e; --border-strong: #38443e;
    --text: #e9efeb; --text-2: #c2ccc6; --muted: #93a19a;
    --primary: #5fb39a; --primary-600: #7cc6af; --primary-50: #1d2e28; --primary-ink: #0d1411;
    --accent: #e0789a; --accent-50: #33202a;
    --ok: #5cc28f; --ok-50: #17291f; --warn: #e2a640; --warn-50: #2c2414; --danger: #f07a6e; --danger-50: #2f1a18;
    --ent-provider: #8ea6f5; --ent-provider-bg: #1d2440;
    --ent-service: #6fcfae; --ent-service-bg: #15302a;
    --ent-sku: #ee8fae; --ent-sku-bg: #3a1c28;
    --ent-spec: #e8b45c; --ent-spec-bg: #33280f;
    --ent-region: #b39cf3; --ent-region-bg: #2a2142;
    --series-1: #3987e5; --series-2: #d95926;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111614; --surface: #171d1a; --surface-2: #1d2420; --surface-3: #252e29;
  --border: #2a332e; --border-strong: #38443e;
  --text: #e9efeb; --text-2: #c2ccc6; --muted: #93a19a;
  --primary: #5fb39a; --primary-600: #7cc6af; --primary-50: #1d2e28; --primary-ink: #0d1411;
  --accent: #e0789a; --accent-50: #33202a;
  --ok: #5cc28f; --ok-50: #17291f; --warn: #e2a640; --warn-50: #2c2414; --danger: #f07a6e; --danger-50: #2f1a18;
  --ent-provider: #8ea6f5; --ent-provider-bg: #1d2440;
  --ent-service: #6fcfae; --ent-service-bg: #15302a;
  --ent-sku: #ee8fae; --ent-sku-bg: #3a1c28;
  --ent-spec: #e8b45c; --ent-spec-bg: #33280f;
  --ent-region: #b39cf3; --ent-region-bg: #2a2142;
  --series-1: #3987e5; --series-2: #d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
}

/* =====================================================================
   2. Base
   ===================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); overflow-x: hidden; font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
a { color: var(--primary-600); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: var(--primary-50); }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-sm { width: 14px; height: 14px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* =====================================================================
   3. App shell: sidebar, top bar, main area
   ===================================================================== */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand-tag { font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-2); font-weight: 500; }
.nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
.nav a.active { background: var(--primary-50); color: var(--primary); }
.nav a .count { margin-left: auto; font-size: 11px; color: var(--muted); }
.side-foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.index-status { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--text-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-top: 5px; flex: none; }

.main-wrap { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 24px; position: sticky; top: 0; z-index: 5; }
.menu-btn { display: none; }
.global-search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; height: 38px; color: var(--muted); }
.global-search input { flex: 1; border: 0; background: transparent; outline: none; color: var(--text); min-width: 0; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.role-select { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.role-select select { height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 0 8px; font-weight: 500; color: var(--text); }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; cursor: pointer; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-weight: 650; font-size: 12px; }
main { padding: 24px; max-width: 1480px; width: 100%; }

/* =====================================================================
   4. Shared components
   ===================================================================== */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin-top: 4px; max-width: 720px; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-head p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.card-body { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main-side { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: var(--primary-600); }
.btn-ghost { background: transparent; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .55; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.active { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.suggest { height: auto; min-height: 30px; padding: 6px 12px; white-space: normal; text-align: left; border-radius: 10px; }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.badge-ok { background: var(--ok-50); color: var(--ok); }
.badge-warn { background: var(--warn-50); color: var(--warn); }
.badge-danger { background: var(--danger-50); color: var(--danger); }
.badge-primary { background: var(--primary-50); color: var(--primary); }
.badge-accent { background: var(--accent-50); color: var(--accent); }
.badge-outline { background: transparent; border: 1px solid var(--border-strong); }

.input, .textarea, .select { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 8px 12px; outline: none; }
.input { height: 38px; }
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus, .textarea:focus, .select:focus, .global-search:focus-within { border-color: var(--primary-600); box-shadow: 0 0 0 3px var(--primary-50); }

.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--surface-2); }
.table tr.selected td { background: var(--primary-50); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.spec-grid .table td, .spec-grid .table th { padding-left: 10px; padding-right: 10px; }

.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); font-size: 13px; border: 1px solid var(--border); }
.callout .ic { margin-top: 1px; color: var(--primary-600); }
.callout-warn { background: var(--warn-50); border-color: transparent; color: var(--text); }
.callout-warn .ic { color: var(--warn); }

.stat { padding: 16px 18px; }
.stat .label { color: var(--muted); font-size: 12px; }
.stat .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

.toggle { position: relative; width: 38px; height: 22px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; transition: .15s; cursor: pointer; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked + span { background: var(--primary-600); }
.toggle input:checked + span::after { transform: translateX(16px); }
.toggle input:disabled + span { opacity: .6; cursor: not-allowed; }

.bar { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary-600); border-radius: 999px; }

/* entity marks used in queries, documents and the translator */
.ent { border-radius: 4px; padding: 0 3px; font-weight: 550; }
.ent small { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; margin-left: 3px; opacity: .85; }
.ent-PROVIDER { background: var(--ent-provider-bg); color: var(--ent-provider); }
.ent-SERVICE { background: var(--ent-service-bg); color: var(--ent-service); }
.ent-SKU { background: var(--ent-sku-bg); color: var(--ent-sku); }
.ent-SPEC { background: var(--ent-spec-bg); color: var(--ent-spec); }
.ent-REGION { background: var(--ent-region-bg); color: var(--ent-region); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; color: var(--muted); padding: 28px; }

/* =====================================================================
   5. Ask page: chat and pipeline trace
   ===================================================================== */
.ask-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); gap: 16px; align-items: start; }
.chat { display: flex; flex-direction: column; min-height: calc(100vh - 176px); }
.chat-log { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.welcome { padding: 8px 4px; }
.welcome h2 { font-size: 18px; }
.welcome > p { color: var(--muted); margin: 6px 0 18px; }
.suggest-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.suggest-group { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.suggest-group h3 { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); }
.msg-user { align-self: flex-end; max-width: 78%; background: var(--primary); color: var(--primary-ink); padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
.msg-bot { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
.bot-avatar { width: 32px; height: 32px; }
.answer { min-width: 0; border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; }
.answer-text p + p { margin-top: 8px; }
.answer-text strong { color: var(--text); }
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px; background: var(--primary-50); color: var(--primary); font-size: 11px; font-weight: 700; vertical-align: 1px; cursor: pointer; }
.watch { display: flex; gap: 8px; background: var(--warn-50); border-radius: 9px; padding: 9px 12px; font-size: 13px; }
.watch .ic { color: var(--warn); margin-top: 1px; }
.map-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.map-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 4px; background: var(--surface-2); }
.map-chip .from { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--text-2); }
.map-chip .to { font-weight: 650; color: var(--primary); }
.sources { display: flex; flex-direction: column; gap: 6px; }
.source { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 12.5px; cursor: pointer; }
.source:hover { background: var(--surface-2); }
.source .meta { color: var(--muted); font-size: 11.5px; }
.answer-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 10px; }
.answer-foot .spacer { flex: 1; }
.answer-foot .icon-btn { width: 30px; height: 30px; }
.composer { display: flex; gap: 8px; padding: 14px 16px 6px; border-top: 1px solid var(--border); }
.composer input { flex: 1; height: 42px; border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; background: var(--surface); outline: none; }
.composer input:focus { border-color: var(--primary-600); box-shadow: 0 0 0 3px var(--primary-50); }
.composer .btn { height: 42px; }
.composer-hint { padding: 0 16px 12px; font-size: 11.5px; color: var(--muted); }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.trace { position: sticky; top: 84px; max-height: calc(100vh - 108px); display: flex; flex-direction: column; }
.trace-body { overflow-y: auto; padding: 6px 18px 18px; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--border); }
.step:last-child { border-bottom: 0; }
.step-n { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-50); color: var(--primary); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.step h3 { font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step .what { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.step .planned { font-size: 11.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 6px; }
.tokens { display: flex; flex-wrap: wrap; gap: 4px; }
.tok { font-family: var(--mono); font-size: 11.5px; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); }
.tok.protected { border-color: var(--accent); color: var(--accent); background: var(--accent-50); }
.tok.stop { opacity: .45; text-decoration: line-through; }
.broken { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.broken .tok { opacity: .8; }
.intent-row { display: grid; grid-template-columns: 130px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
.intent-row.top { font-weight: 650; }
.qtext { line-height: 2; font-size: 13px; }
.link-row { display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.link-row:last-child { border-bottom: 0; }
.link-row .how { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
.rewrite { font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; line-height: 1.7; }
.rewrite mark { background: var(--primary-50); color: var(--primary); border-radius: 4px; padding: 0 3px; font-weight: 600; }
.mini-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.mini-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); font-size: 11px; }
.mini-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); }
.mini-table tr.used td { background: var(--primary-50); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 3px 0; }
.check .ic { width: 16px; height: 16px; margin-top: 1px; }
.check.ok .ic { color: var(--ok); } .check.warn .ic { color: var(--warn); } .check.bad .ic { color: var(--danger); }
details.prompt summary { cursor: pointer; font-size: 12px; color: var(--primary-600); margin-top: 8px; }
details.prompt pre { white-space: pre-wrap; background: var(--surface-2); padding: 10px; border-radius: 8px; font-size: 11.5px; max-height: 240px; overflow: auto; }

/* =====================================================================
   6. Other pages
   ===================================================================== */
.translated { font-size: 14px; line-height: 2; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; min-height: 52px; }
.translated mark { background: var(--primary-50); color: var(--primary); font-weight: 650; border-radius: 4px; padding: 1px 4px; }
.translated s { color: var(--muted); }
.provider-cell { line-height: 1.35; }
.provider-cell .alias { font-size: 11.5px; color: var(--muted); }
.nimbus-cell { font-weight: 650; color: var(--primary); }
.hit { background: var(--warn-50); border-radius: 3px; }
.detail-title { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.tag-list { display: flex; gap: 6px; flex-wrap: wrap; }

.spec-parsed { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.spec-parsed div { background: var(--surface-2); border-radius: 9px; padding: 9px 11px; }
.spec-parsed b { display: block; font-size: 16px; }
.spec-parsed span { font-size: 11.5px; color: var(--muted); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.match:last-child { border-bottom: 0; }
.match .code { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.match .why { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.match .score { text-align: right; }
.match .score b { font-size: 20px; }
.best-label { font-size: 11px; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: .05em; }

.pipeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.pstep { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--surface-2); position: relative; }
.pstep b { display: block; font-size: 12.5px; }
.pstep span { font-size: 11.5px; color: var(--muted); }
.pstep .badge { margin-top: 6px; }
.chunk { border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.75; }
.chunk + .chunk { margin-top: 10px; }
.chunk-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
pre.json { background: var(--surface-2); border-radius: 9px; padding: 10px 12px; overflow: auto; font-size: 11.5px; margin: 0; }
.redacted { background: var(--accent-50); color: var(--accent); border-radius: 4px; padding: 0 4px; font-weight: 650; font-family: var(--mono); font-size: 12px; }

.ring-wrap { display: flex; gap: 18px; align-items: center; }
.week { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.week + .week { margin-top: 12px; }
.week-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface-2); }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-top: 1px solid var(--border); cursor: pointer; }
.task input { margin-top: 3px; accent-color: var(--primary-600); width: 15px; height: 15px; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.task .link { margin-left: auto; font-size: 12px; white-space: nowrap; }
.flash { border: 1px solid var(--border); border-radius: 12px; padding: 18px; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 8px; background: linear-gradient(135deg, var(--primary-50), var(--surface)); cursor: pointer; }
.flash .big { font-size: 20px; font-weight: 650; }
.quiz-q { font-weight: 600; margin-bottom: 10px; }
.quiz-opts { display: grid; gap: 6px; }
.quiz-opt { text-align: left; border: 1px solid var(--border); background: var(--surface); padding: 8px 12px; border-radius: 9px; cursor: pointer; }
.quiz-opt:hover { background: var(--surface-2); }
.quiz-opt.right { border-color: var(--ok); background: var(--ok-50); }
.quiz-opt.wrong { border-color: var(--danger); background: var(--danger-50); }

.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; }
.chart-box .axis text { fill: var(--muted); font-size: 11px; }
.chart-box .grid-line { stroke: var(--border); stroke-width: 1; }
.chart-box .val { fill: var(--text-2); font-size: 11px; font-weight: 600; }
.chart-tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 7px; opacity: 0; transition: opacity .1s; white-space: nowrap; z-index: 3; }
.rank { font-variant-numeric: tabular-nums; font-weight: 650; }
.rank.r1 { color: var(--ok); } .rank.miss { color: var(--danger); font-weight: 500; }

.setting { display: flex; gap: 14px; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--border); }
.setting:last-child { border-bottom: 0; }
.setting .t { font-weight: 600; }
.setting .d { color: var(--muted); font-size: 12.5px; }
.setting .toggle { margin-left: auto; margin-top: 2px; }

/* =====================================================================
   7. Responsive layout
   ===================================================================== */
@media (max-width: 1180px) {
  .ask-grid { grid-template-columns: minmax(0, 1fr); }
  .trace { position: static; max-height: none; }
  .pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g-main-side, .spec-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 20; left: 0; top: 0; width: 260px; transform: translateX(-100%); transition: .2s; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .menu-btn { display: grid; }
  .g-2, .g-3, .g-4, .suggest-groups { grid-template-columns: minmax(0, 1fr); }
  .spec-parsed { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .role-select label { display: none; }
  main { padding: 16px; }
  .topbar { padding: 0 16px; }
  .global-search .kbd { display: none; }
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .match { grid-template-columns: minmax(0, 1fr); }
  .trace-body .mini-table { display: block; overflow-x: auto; }
  .match .score { text-align: left; }
}
@media (max-width: 560px) {
  .global-search { display: none; }
  .msg-user { max-width: 92%; }
}
</style>

<script id="cl-data">
/* =====================================================================
   CloudLexis demo data
   ---------------------------------------------------------------------
   Everything below is synthetic. Nimbus Cloud is a fictional provider,
   so its product names, prices and policies are invented for the demo.
   Public AWS, Azure and Google Cloud names and instance specs are used
   only to show how terms map; check the official docs before real use.
   ===================================================================== */

const PROVIDERS = { aws: 'AWS', azure: 'Azure', gcp: 'Google Cloud', nimbus: 'Nimbus Cloud' };

const ROLES = {
  se: 'Solutions Engineer',
  support: 'Support Engineer',
  am: 'Account Manager'
};

/* ---------------------------------------------------------------------
   Cross-cloud glossary. One entry = one concept.
   aliases  : the ways people write the name (lower case); used by the
              entity recogniser and the linker.
   generic  : vendor-neutral words for the same idea.
   doc      : the main knowledge-base document for the concept.
   watch    : a short "watch out" note shown with answers.
   --------------------------------------------------------------------- */
const CONCEPTS = [
  { id: 'compute.vm', category: 'Compute', plain: 'Virtual servers that customers rent and pay for by the second or hour.',
    aws: { name: 'Amazon EC2', aliases: ['ec2', 'amazon ec2', 'elastic compute cloud'] },
    azure: { name: 'Azure Virtual Machines', aliases: ['azure virtual machines', 'azure virtual machine', 'azure vm', 'azure vms'] },
    gcp: { name: 'Compute Engine', aliases: ['compute engine', 'google compute engine', 'gce'] },
    nimbus: { name: 'Nimbus Elastic Server (NES)', short: 'NES', aliases: ['nimbus elastic server', 'elastic server', 'nes'] },
    generic: ['virtual machine', 'virtual machines', 'vm', 'vms', 'instance type', 'virtual server'],
    doc: 'D01', watch: 'NES bills per second with a one-minute minimum. Instance names follow nx-{family}{generation}-{vCPU}x{memory}.' },

  { id: 'compute.serverless', category: 'Compute', plain: 'Run small pieces of code on events without managing any server.',
    aws: { name: 'AWS Lambda', aliases: ['lambda', 'aws lambda', 'lambda function', 'lambda functions'] },
    azure: { name: 'Azure Functions', aliases: ['azure functions', 'azure function', 'function app'] },
    gcp: { name: 'Cloud Run functions', aliases: ['cloud run functions', 'cloud functions', 'google cloud functions'] },
    nimbus: { name: 'Nimbus Pulse Functions', short: 'Pulse Functions', aliases: ['nimbus pulse functions', 'pulse functions', 'pulse function'] },
    generic: ['serverless', 'function as a service', 'faas'],
    doc: 'D09', watch: 'A Pulse Functions call can run for up to 20 minutes with up to 8 GB of memory. Longer jobs belong on NKS or NES.' },

  { id: 'compute.k8s', category: 'Containers', plain: 'Managed Kubernetes clusters for running containers.',
    aws: { name: 'Amazon EKS', aliases: ['eks', 'amazon eks', 'elastic kubernetes service'] },
    azure: { name: 'Azure Kubernetes Service (AKS)', aliases: ['aks', 'azure kubernetes service'] },
    gcp: { name: 'Google Kubernetes Engine (GKE)', aliases: ['gke', 'google kubernetes engine'] },
    nimbus: { name: 'Nimbus Kube Service (NKS)', short: 'NKS', aliases: ['nimbus kube service', 'kube service', 'nks'] },
    generic: ['kubernetes', 'k8s', 'managed kubernetes'],
    doc: 'D10', watch: 'The first NKS control plane in each account is free. Extra clusters cost 0.10 USD per hour.' },

  { id: 'compute.registry', category: 'Containers', plain: 'A private store for container images.',
    aws: { name: 'Amazon ECR', aliases: ['ecr', 'amazon ecr', 'elastic container registry'] },
    azure: { name: 'Azure Container Registry', aliases: ['acr', 'azure container registry'] },
    gcp: { name: 'Artifact Registry', aliases: ['artifact registry', 'gcr'] },
    nimbus: { name: 'Nimbus Image Hub', short: 'Image Hub', aliases: ['nimbus image hub', 'image hub'] },
    generic: ['container registry', 'docker registry', 'image registry'],
    doc: 'D10', watch: 'Image Hub is regional. Copy images to every region where NKS clusters run.' },

  { id: 'storage.object', category: 'Storage', plain: 'Store files as objects in buckets and read them over HTTP.',
    aws: { name: 'Amazon S3', aliases: ['s3', 'amazon s3', 'simple storage service', 's3 bucket', 's3 buckets'] },
    azure: { name: 'Azure Blob Storage', aliases: ['blob storage', 'azure blob storage', 'azure blob'] },
    gcp: { name: 'Cloud Storage', aliases: ['cloud storage', 'google cloud storage', 'gcs'] },
    nimbus: { name: 'Nimbus Object Store (NOS)', short: 'NOS', aliases: ['nimbus object store', 'object store', 'nos'] },
    generic: ['object storage', 'bucket', 'buckets'],
    doc: 'D07', watch: 'NOS has three tiers: Hot, Warm and Frozen. Bucket names are unique per region, not worldwide.' },

  { id: 'storage.archive', category: 'Storage', plain: 'Very cheap storage for data that is rarely read, such as old backups.',
    aws: { name: 'Amazon S3 Glacier', aliases: ['glacier', 's3 glacier', 'glacier deep archive', 'deep archive'] },
    azure: { name: 'Blob Storage Archive tier', aliases: ['archive tier', 'azure archive', 'archive access tier'] },
    gcp: { name: 'Cloud Storage Archive class', aliases: ['archive class', 'archive storage class'] },
    nimbus: { name: 'NOS Frozen tier', short: 'Frozen tier', aliases: ['nos frozen tier', 'frozen tier', 'nos frozen'] },
    generic: ['archive storage', 'cold storage', 'long-term archive', 'archive'],
    doc: 'D08', watch: 'A restore from the Frozen tier takes 3 to 12 hours, and data must stay for at least 180 days.' },

  { id: 'storage.block', category: 'Storage', plain: 'Disks that attach to one virtual server.',
    aws: { name: 'Amazon EBS', aliases: ['ebs', 'amazon ebs', 'elastic block store', 'ebs volume', 'ebs volumes'] },
    azure: { name: 'Azure Managed Disks', aliases: ['managed disks', 'managed disk', 'azure disk', 'azure disks'] },
    gcp: { name: 'Persistent Disk', aliases: ['persistent disk', 'persistent disks'] },
    nimbus: { name: 'Nimbus Block Disk (NBD)', short: 'NBD', aliases: ['nimbus block disk', 'block disk', 'nbd'] },
    generic: ['block storage', 'disk', 'disks', 'volume', 'volumes'],
    doc: 'D11', watch: 'NBD Performance SSD reaches 50,000 IOPS only on instances with 8 or more vCPU.' },

  { id: 'storage.file', category: 'Storage', plain: 'A shared file system that many servers can use at the same time.',
    aws: { name: 'Amazon EFS', aliases: ['efs', 'amazon efs', 'elastic file system'] },
    azure: { name: 'Azure Files', aliases: ['azure files', 'azure file share'] },
    gcp: { name: 'Filestore', aliases: ['filestore'] },
    nimbus: { name: 'Nimbus File Share', short: 'File Share', aliases: ['nimbus file share', 'file share'] },
    generic: ['nfs', 'shared file system', 'file storage'],
    doc: 'D11', watch: 'File Share supports NFS v4.1 only. SMB is on the roadmap.' },

  { id: 'network.vpc', category: 'Networking', plain: 'A private, isolated network for a customer’s cloud resources.',
    aws: { name: 'Amazon VPC', aliases: ['vpc', 'amazon vpc', 'aws vpc'] },
    azure: { name: 'Azure Virtual Network (VNet)', aliases: ['vnet', 'vnets', 'virtual network', 'azure virtual network'] },

    nimbus: { name: 'Nimbus Private Network (NPN)', short: 'NPN', aliases: ['nimbus private network', 'private network', 'npn', 'npns'] },

    doc: 'D12', watch: 'An NPN is regional, like an AWS VPC or an Azure VNet. A Google Cloud VPC network is global, so subnet plans need to change.' },

  { id: 'network.lb', category: 'Networking', plain: 'Spreads incoming traffic across many servers.',
    aws: { name: 'Elastic Load Balancing (ELB)', aliases: ['elb', 'elastic load balancing', 'alb', 'nlb', 'application load balancer', 'network load balancer'] },

    doc: 'D13', watch: 'One NTB runs in Layer 4 or Layer 7 mode, so customers do not need two products as with ALB and NLB.' },

  { id: 'network.cdn', category: 'Networking', plain: 'Caches content close to users so websites load faster.',
    aws: { name: 'Amazon CloudFront', aliases: ['cloudfront', 'amazon cloudfront'] },

    gcp: { name: 'Cloud CDN', aliases: ['cloud cdn'] },
    nimbus: { name: 'Nimbus Edge CDN', short: 'Edge CDN', aliases: ['nimbus edge cdn', 'edge cdn', 'nimbus cdn'] },
    generic: ['cdn', 'content delivery network', 'edge cache'],
    doc: 'D14', watch: 'Edge CDN has 120 edge locations. Check coverage for customers in Africa and South America.' },

  { id: 'network.dns', category: 'Networking', plain: 'Turns domain names into IP addresses.',
    aws: { name: 'Amazon Route 53', aliases: ['route 53', 'route53', 'amazon route 53'] },
    azure: { name: 'Azure DNS', aliases: ['azure dns'] },
    gcp: { name: 'Cloud DNS', aliases: ['cloud dns'] },
    nimbus: { name: 'Nimbus DNS', short: 'Nimbus DNS', aliases: ['nimbus dns'] },
    generic: ['dns', 'hosted zone', 'domain name'],
    doc: 'D14', watch: 'Nimbus DNS does not support latency-based routing yet. Use weighted records instead.' },

  { id: 'db.relational', category: 'Databases', plain: 'Managed MySQL or PostgreSQL databases with backups and failover.',
    aws: { name: 'Amazon RDS', aliases: ['rds', 'amazon rds', 'relational database service'] },
    azure: { name: 'Azure SQL Database', aliases: ['azure sql', 'azure sql database', 'azure database for postgresql', 'azure database for mysql'] },
    gcp: { name: 'Cloud SQL', aliases: ['cloud sql'] },
    nimbus: { name: 'Nimbus Managed SQL (NMS)', short: 'NMS', aliases: ['nimbus managed sql', 'managed sql', 'nms'] },

  { id: 'db.warehouse', category: 'Analytics', plain: 'A data warehouse for running SQL over very large data sets.',

    nimbus: { name: 'Nimbus Lakehouse', short: 'Lakehouse', aliases: ['nimbus lakehouse', 'lakehouse'] },
    generic: ['data warehouse', 'warehouse'],
    doc: 'D16', watch: 'Lakehouse bills per TB scanned, like BigQuery on-demand, not per node like a provisioned Redshift cluster.' },

  { id: 'msg.queue', category: 'Integration', plain: 'Passes messages between services so they can work at their own pace.',

    nimbus: { name: 'Nimbus Queue', short: 'Nimbus Queue', aliases: ['nimbus queue'] },

    'will with would you your here any some about need needs want get give tell should much many').split(' '));

  const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  /* -------------------------------------------------------------------
     STEP 1. Tokenisation
     Product codes and region names are found first and kept as one
     token. A normal word splitter would break "m5.2xlarge" into "m5"
     and "2xlarge", and the code would no longer match anything.
     ------------------------------------------------------------------- */
  const SKU_PATTERNS = [
    { provider: 'nimbus', re: /\bnx-[a-z]{2}\d-\d+x\d+(?:-\d+g)?\b/gi },
    { provider: 'azure', re: /\bStandard_[A-Za-z0-9]+(?:_[A-Za-z0-9]+)*\b/gi },
    { provider: 'gcp', re: /\b(?:n1|n2|n2d|n4|e2|c2|c2d|c3|c3d|m1|m2|m3|g2|a2|a3|t2d)-(?:standard|highmem|highcpu|ultramem|megamem)-\d+\b/gi },
    { provider: 'aws', re: /\b[a-z]\d[a-z0-9]*\.(?:nano|micro|small|medium|large|\d*xlarge|metal)\b/gi }
  ];

  // region code (lower case) -> { region, provider }
  const REGION_INDEX = new Map();
  REGIONS.forEach(r => {
    REGION_INDEX.set(r.nimbus, { region: r, provider: 'nimbus' });
    ['aws', 'azure', 'gcp'].forEach(p => r[p].forEach(code => REGION_INDEX.set(code.toLowerCase(), { region: r, provider: p })));
  });
  const REGION_RE = new RegExp('\\b(?:' + [...REGION_INDEX.keys()].sort((a, b) => b.length - a.length).map(escRe).join('|') + ')\\b', 'gi');

  function tokenize(text) {
    const spans = [];
    const add = (m, kind, provider) => spans.push({ start: m.index, end: m.index + m[0].length, text: m[0], kind, provider });
    SKU_PATTERNS.forEach(p => { p.re.lastIndex = 0; let m; while ((m = p.re.exec(text))) add(m, 'sku', p.provider); });
    REGION_RE.lastIndex = 0;
    let m;
    while ((m = REGION_RE.exec(text))) add(m, 'region', REGION_INDEX.get(m[0].toLowerCase()).provider);

    // keep the earliest span; on a tie keep the longest
    spans.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
    const kept = [];
    let lastEnd = -1;
    for (const s of spans) if (s.start >= lastEnd) { kept.push(s); lastEnd = s.end; }

    // ordinary words between the protected spans; "12.5" and "6,000" stay whole
    const tokens = [];
    const WORD = /[A-Za-z0-9]+(?:[.,][0-9]+)*/g;
    const pushWords = (from, to) => {
      const seg = text.slice(from, to);
      WORD.lastIndex = 0;
      let w;
      while ((w = WORD.exec(seg))) tokens.push({ text: w[0], norm: w[0].toLowerCase(), start: from + w.index, end: from + w.index + w[0].length, protected: false });
    };
    let pos = 0;
    for (const s of kept) {
      pushWords(pos, s.start);
      tokens.push({ text: s.text, norm: s.text.toLowerCase(), start: s.start, end: s.end, protected: true, kind: s.kind, provider: s.provider });
      pos = s.end;
    }
    pushWords(pos, text.length);
    return tokens;
  }

  // What a plain splitter would do, shown in the trace for comparison
  const naiveSplit = text => text.split(/[^A-Za-z0-9]+/).filter(Boolean);

  // Light normalisation for keyword search: lower case, drop stop words,
  // strip a plural "s". Product codes are never changed.
  const stem = w => (w.length > 4 && w.endsWith('s') && !w.endsWith('ss') && !/\d/.test(w)) ? w.slice(0, -1) : w;
  const indexTerms = tokens => tokens.filter(t => t.protected || !STOPWORDS.has(t.norm)).map(t => t.protected ? t.norm : stem(t.norm));
  const isStop = t => !t.protected && STOPWORDS.has(t.norm);

  /* -------------------------------------------------------------------
     STEP 2. Intent classification
     Prototype: a keyword model with softmax scores.
     Planned: DistilBERT fine-tuned on labelled questions.
     ------------------------------------------------------------------- */
  const INTENTS = [
    { id: 'service_mapping', label: 'Service mapping', cues: ['equivalent', 'version of', 'like', 'similar', 'replace', 'replaces', 'alternative', 'matches', 'match', 'instead of', 'counterpart', 'do we have', 'is there'] },
    { id: 'migration_sizing', label: 'Migration sizing', cues: ['migrate', 'migration', 'move', 'moving', 'offer', 'recommend', 'sizing', 'size', 'runs', 'running', 'uses', 'customer'] },
    { id: 'spec_lookup', label: 'Spec lookup', cues: ['vcpu', 'memory', 'gib', 'iops', 'gbps', 'spec', 'specs', 'limit', 'how many', 'maximum', 'sla', 'uptime', 'how long', 'kept'] },
    { id: 'pricing_policy', label: 'Pricing and policy', cues: ['price', 'cost', 'costs', 'discount', 'approval', 'credit', 'credits', 'billing', 'billed', 'usd', 'quote', 'per hour', 'how much'] },
    { id: 'how_to', label: 'How-to and process', cues: ['how do i', 'how to', 'steps', 'process', 'set up', 'connect', 'request', 'first week', 'onboarding', 'should i do'] },
    { id: 'concept', label: 'Concept explanation', cues: ['what is', 'explain', 'difference', 'why', 'meaning', 'overview', 'named'] }
  ];

  function classifyIntent(text, ents) {
    const t = ' ' + text.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
    const scores = INTENTS.map(it => ({ id: it.id, label: it.label, score: 0.2 + it.cues.reduce((s, c) => s + (t.includes(' ' + c + ' ') ? 1 : 0), 0) }));
    const get = id => scores.find(s => s.id === id);
    if (ents.some(e => e.label === 'SKU')) get('migration_sizing').score += 1.2;
    if (ents.some(e => e.label === 'SERVICE' && e.provider && e.provider !== 'nimbus')) get('service_mapping').score += 1;
    if (ents.some(e => e.label === 'REGION')) get('service_mapping').score += 0.6;
    const T = 0.6;                                   // softmax temperature
    const ex = scores.map(s => Math.exp(s.score / T));
    const Z = ex.reduce((a, b) => a + b, 0);
    scores.forEach((s, i) => { s.prob = ex[i] / Z; });
    return scores.sort((a, b) => b.prob - a.prob);
  }

  /* -------------------------------------------------------------------
     STEP 3. Entity recognition
     Labels: PROVIDER, SERVICE, SKU, SPEC, REGION.
     Prototype: gazetteer (glossary aliases) + regular expressions +
     fuzzy matching for typos. Planned: add a fine-tuned transformer NER
     model to catch names that are not in the glossary yet.
     ------------------------------------------------------------------- */
  const ALIAS = new Map();          // "token token" -> [{ concept, provider }]
  let MAX_ALIAS_LEN = 1;
  const aliasKey = s => tokenize(s).map(t => t.norm).join(' ');
  function addAlias(a, concept, provider) {
    const key = aliasKey(a);
    if (!ALIAS.has(key)) ALIAS.set(key, []);
    const list = ALIAS.get(key);
    if (!list.some(x => x.concept === concept && x.provider === provider)) list.push({ concept, provider });
    MAX_ALIAS_LEN = Math.max(MAX_ALIAS_LEN, key.split(' ').length);
  }
  CONCEPTS.forEach(c => {
    ['aws', 'azure', 'gcp', 'nimbus'].forEach(p => c[p].aliases.forEach(a => addAlias(a, c, p)));
    c.generic.forEach(a => addAlias(a, c, null));
  });
  // single-word, vendor-specific aliases used for fuzzy matching
  const FUZZY_ALIASES = [...ALIAS.entries()].filter(([k, v]) => !k.includes(' ') && k.length >= 5 && v.some(x => x.provider));

  const PROVIDER_WORDS = { 'aws': 'aws', 'amazon': 'aws', 'azure': 'azure', 'microsoft': 'azure', 'gcp': 'gcp', 'google': 'gcp', 'google cloud': 'gcp', 'nimbus': 'nimbus', 'nimbus cloud': 'nimbus' };
  const UNIT = u => /cpu|core/i.test(u) ? 'vcpu' : /gpu/i.test(u) ? 'gpu' : 'mem';

  function levenshtein(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }

  function recognise(text, opts = {}) {
    const useGeneric = opts.generic !== false;
    const useFuzzy = opts.fuzzy !== false;
    const tokens = tokenize(text);
    const ents = [];
    const covered = new Set();
    let i = 0;
    while (i < tokens.length) {
      const t = tokens[i];
      if (t.protected) {
        if (t.kind === 'sku') ents.push({ label: 'SKU', text: t.text, start: t.start, end: t.end, provider: t.provider });
        else ents.push({ label: 'REGION', text: t.text, start: t.start, end: t.end, provider: t.provider, region: REGION_INDEX.get(t.norm).region });
        covered.add(i); i++; continue;
      }
      let matched = false;
      for (let n = Math.min(MAX_ALIAS_LEN, tokens.length - i); n >= 1 && !matched; n--) {
        const slice = tokens.slice(i, i + n);
        if (slice.some(x => x.protected)) continue;
        const key = slice.map(x => x.norm).join(' ');
        // plural fallback: "VPCs" -> "vpc"
        let cands = ALIAS.get(key) || (key.length > 3 && key.endsWith('s') ? ALIAS.get(key.slice(0, -1)) : undefined);
        if (cands && !useGeneric) cands = cands.filter(c => c.provider);
        const span = { start: slice[0].start, end: slice[n - 1].end, text: text.slice(slice[0].start, slice[n - 1].end) };
        if (cands && cands.length) {
          const provs = [...new Set(cands.map(c => c.provider))];
          ents.push({ label: 'SERVICE', ...span, candidates: cands, provider: provs.length === 1 ? provs[0] : null });
          matched = true;
        } else if (PROVIDER_WORDS[key]) {
          ents.push({ label: 'PROVIDER', ...span, provider: PROVIDER_WORDS[key] });
          matched = true;
        }
        if (matched) { for (let k = i; k < i + n; k++) covered.add(k); i += n; }
      }
      if (!matched) i++;
    }

    // fuzzy match for typos such as "cloudwach" -> "cloudwatch"
    if (useFuzzy) tokens.forEach((t, idx) => {
      if (covered.has(idx) || isStop(t) || t.norm.length < 5 || /\d/.test(t.norm)) return;
      let best = null;
      for (const [alias, cands] of FUZZY_ALIASES) {
        const sim = 1 - levenshtein(t.norm, alias) / Math.max(t.norm.length, alias.length);
        if (sim >= 0.8 && sim < 1 && (!best || sim > best.sim)) best = { sim, alias, cands };
      }
      if (best) {
        const provs = [...new Set(best.cands.map(c => c.provider))];
        ents.push({ label: 'SERVICE', text: t.text, start: t.start, end: t.end, candidates: best.cands.filter(c => c.provider), provider: provs.length === 1 ? provs[0] : null, fuzzy: best.sim, fuzzyAlias: best.alias });
      }
    });

    // specs written as numbers: "8 vCPU", "32 GB", "1 GPU"
    const SPEC_RE = /(\d+(?:\.\d+)?)\s*(vcpus?|cpus?|cores?|gib|gb|gpus?)\b/gi;
    let m;
    while ((m = SPEC_RE.exec(text))) {
      const s = m.index, e = s + m[0].length;
      if (!ents.some(x => s < x.end && e > x.start)) ents.push({ label: 'SPEC', text: m[0], start: s, end: e, value: parseFloat(m[1]), unit: UNIT(m[2]) });
    }
    ents.sort((a, b) => a.start - b.start);
    return { tokens, ents };
  }

  /* -------------------------------------------------------------------
     Instance specs: read vCPU and memory from a product code, then find
     the closest Nimbus instance type.
     ------------------------------------------------------------------- */
  function parseSku(code, provider) {
    const known = COMPETITOR_SKUS.find(s => s.code.toLowerCase() === code.toLowerCase());
    if (known) return { vcpu: known.vcpu, mem: known.mem, gpu: known.gpu, provider: known.provider, source: 'public spec table' };
    const c = code.toLowerCase();
    if (provider === 'aws') {
      const m = c.match(/^([a-z])(\d)[a-z0-9]*\.(\d*)(nano|micro|small|medium|large|xlarge|metal)$/);
      if (!m || m[4] === 'metal') return null;
      const vcpu = m[4] === 'xlarge' ? 4 * parseInt(m[3] || '1', 10) : 2;
      const ratio = { m: 4, c: 2, r: 8, x: 16, t: 4, g: 4 }[m[1]] || 4;
      return { vcpu, mem: vcpu * ratio, gpu: m[1] === 'g' || m[1] === 'p' ? 1 : 0, provider, source: 'estimated from the name' };
    }
    if (provider === 'azure') {
      const m = c.match(/^standard_([a-z]+)(\d+)/);
      if (!m) return null;
      const vcpu = parseInt(m[2], 10), fam = m[1][0];
      const ratio = { d: 4, f: 2, e: 8, m: 16, b: 4, n: 7 }[fam] || 4;
      return { vcpu, mem: vcpu * ratio, gpu: fam === 'n' ? 1 : 0, provider, source: 'estimated from the name' };
    }
    if (provider === 'gcp') {
      const m = c.match(/^([a-z0-9]+)-(standard|highmem|highcpu|ultramem|megamem)-(\d+)$/);
      if (!m) return null;
      const vcpu = parseInt(m[3], 10);
      const ratio = { standard: 4, highmem: 8, highcpu: m[1].startsWith('c2') ? 2 : 1, ultramem: 24, megamem: 14 }[m[2]];
      return { vcpu, mem: vcpu * ratio, gpu: ['g2', 'a2', 'a3'].includes(m[1]) ? 1 : 0, provider, source: 'estimated from the name' };
    }
    if (provider === 'nimbus') {
      const s = NIMBUS_SKUS.find(x => x.code === c);
      return s ? { vcpu: s.vcpu, mem: s.mem, gpu: s.gpu, provider, source: 'Nimbus spec sheet' } : null;
    }
    return null;
  }

  // memory per vCPU decides the family: about 2 = compute, 4 = general, 8 = memory
  const famLabel = f => FAMILY_NAMES[f].toLowerCase().replace('(gpu)', '(GPU)');
  const withArticle = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
  const familyOf = spec => spec.gpu > 0 ? 'ac' : (spec.mem / spec.vcpu <= 2.5 ? 'cp' : spec.mem / spec.vcpu <= 5.5 ? 'gp' : 'mo');

  function matchSku(spec) {
    const fam = familyOf(spec);
    return NIMBUS_SKUS.map(s => {
      const dv = Math.abs(Math.log2(s.vcpu / spec.vcpu));       // size gap in "doublings"
      const dm = Math.abs(Math.log2(s.mem / spec.mem));
      const gpuGap = (spec.gpu > 0) !== (s.gpu > 0) ? 2.5 : 0;
      const under = (s.vcpu < spec.vcpu || s.mem < spec.mem) ? 0.25 : 0;   // prefer not to undersize
      const famGap = s.family === fam ? 0 : 0.15;
      const score = Math.round(100 * Math.exp(-0.9 * (dv + dm + gpuGap + under + famGap)));
      const reasons = [
        s.vcpu === spec.vcpu ? { ok: true, t: `Same vCPU (${s.vcpu})` } : { ok: s.vcpu > spec.vcpu, t: `${s.vcpu} vCPU vs ${spec.vcpu}` },
        s.mem === spec.mem ? { ok: true, t: `Same memory (${s.mem} GiB)` } : { ok: s.mem > spec.mem, t: `${s.mem} GiB vs ${spec.mem} GiB` },
        s.family === fam ? { ok: true, t: `Same family: ${famLabel(fam)}` } : { ok: false, t: `Different family: ${famLabel(s.family)}` }
      ];
      if (spec.gpu || s.gpu) reasons.push(s.gpu === spec.gpu ? { ok: true, t: `Same GPU count (${s.gpu})` } : { ok: false, t: `${s.gpu} GPU vs ${spec.gpu}` });
      return { sku: s, score, reasons };
    }).sort((a, b) => b.score - a.score);
  }

  /* -------------------------------------------------------------------
     STEP 4. Entity linking
     Each mention is tied to one glossary concept and to its Nimbus
     name. Names used by two providers (e.g. "VPC") are resolved from the
     provider named in the question.
     ------------------------------------------------------------------- */
  function link(ents) {
    const mentioned = new Set(ents.filter(e => e.label === 'PROVIDER').map(e => e.provider));
    const links = [];
    for (const e of ents) {
      if (e.label === 'SERVICE') {
        const byConcept = new Map();
        e.candidates.forEach(c => { if (!byConcept.has(c.concept.id)) byConcept.set(c.concept.id, []); byConcept.get(c.concept.id).push(c); });
        for (const cands of byConcept.values()) {
          const concept = cands[0].concept;
          const provs = [...new Set(cands.map(c => c.provider))];
          let from = provs[0];
          let how = e.fuzzy ? `fuzzy match (${Math.round(e.fuzzy * 100)}% similar to "${e.fuzzyAlias}")` : (from ? 'glossary alias' : 'generic term');
          if (provs.length > 1) {
            const names = provs.map(p => PROVIDERS[p]).join(' and ');
            const hit = provs.find(p => mentioned.has(p));
            if (hit) { from = hit; how = `"${e.text}" is used by ${names}; the question names ${PROVIDERS[hit]}`; }
            else { how = `"${e.text}" is used by ${names}; no provider named, ${PROVIDERS[from]} assumed`; e.ambiguous = true; }
          }
          links.push({ kind: 'service', mention: e.text, concept, from, how, target: concept.nimbus.name, ent: e });
        }
      } else if (e.label === 'SKU') {
        const spec = parseSku(e.text, e.provider);
        if (!spec) continue;
        if (e.provider === 'nimbus') {
          const own = NIMBUS_SKUS.find(s => s.code === e.text.toLowerCase());
          links.push({ kind: 'sku', mention: e.text, from: 'nimbus', spec, target: e.text, nimbusSku: own, match: null, how: 'already a Nimbus instance type', ent: e });
        } else {
          const best = matchSku(spec)[0];
          links.push({ kind: 'sku', mention: e.text, from: e.provider, spec, target: best.sku.code, nimbusSku: best.sku, match: best,
            how: `${spec.vcpu} vCPU, ${spec.mem} GiB${spec.gpu ? `, ${spec.gpu} GPU` : ''} (${spec.source}); closest Nimbus type`, ent: e });
        }
      } else if (e.label === 'REGION' && e.provider !== 'nimbus') {
        links.push({ kind: 'region', mention: e.text, from: e.provider, region: e.region, target: `${e.region.nimbus} (${e.region.city})`, how: 'region table', ent: e });
      }
    }
    // "8 vCPU and 32 GB" without a product code still gets a size match
    const v = ents.find(e => e.label === 'SPEC' && e.unit === 'vcpu');
    const mm = ents.find(e => e.label === 'SPEC' && e.unit === 'mem');
    if (!links.some(l => l.kind === 'sku') && v && mm) {
      const g = ents.find(e => e.label === 'SPEC' && e.unit === 'gpu');
      const spec = { vcpu: v.value, mem: mm.value, gpu: g ? g.value : 0, source: 'specs in the question' };
      const best = matchSku(spec)[0];
      links.push({ kind: 'sku', mention: `${v.text}, ${mm.text}`, from: null, spec, target: best.sku.code, nimbusSku: best.sku, match: best, how: 'built from the specs in the question' });
    }
    // an instance type always implies the virtual server concept
    const sku = links.find(l => l.kind === 'sku');
    if (sku && !links.some(l => l.kind === 'service' && l.concept.id === 'compute.vm')) {
      links.push({ kind: 'service', mention: '(instance type)', concept: CONCEPTS[0], from: sku.from, how: 'implied by the instance type', target: CONCEPTS[0].nimbus.name, implied: true });
    }
    return links;
  }

  /* -------------------------------------------------------------------
     STEP 5. Query rewriting: add the Nimbus names to the question so
     that keyword search can find Nimbus documents. Terms that are
     already Nimbus words, or only implied, are not added.
     ------------------------------------------------------------------- */
  function rewrite(query, links) {
    const added = [];
    // a concept the user already named with a Nimbus word needs no expansion
    const named = new Set(links.filter(l => l.kind === 'service' && l.from === 'nimbus').map(l => l.concept.id));
    links.filter(l => !l.implied && l.from !== 'nimbus' && !(l.kind === 'service' && named.has(l.concept.id))).forEach(l => {
      if (l.kind === 'service') {
        const n = l.concept.nimbus;
        added.push(n.name.replace(/[()]/g, ''));
      }
      if (l.kind === 'sku' && l.nimbusSku) added.push(l.nimbusSku.code, famLabel(l.nimbusSku.family));
      if (l.kind === 'region') added.push(l.region.nimbus, l.region.city);
    });
    const lower = query.toLowerCase();
    const uniq = [...new Set(added)].filter(a => !lower.includes(a.toLowerCase()));
    return { text: uniq.length ? `${query} ${uniq.join(' ')}` : query, added: uniq };
  }

  /* -------------------------------------------------------------------
     Indexing: redact personal data, split documents into chunks, tag
     entities in each chunk and build BM25 statistics.
     ------------------------------------------------------------------- */
  const PII_RULES = [
    { label: 'EMAIL', re: /\b[\w.+-]+@[\w-]+\.[\w.]+\b/g },
    { label: 'PHONE', re: /\+\d{1,3}[\s-]?\(?\d{2,3}\)?[\s-]?\d{3}[\s-]?\d{4}\b/g },
    { label: 'ACCESS_KEY', re: /\b(?:AKIA|ASIA)[A-Z0-9]{16}\b/g },
    { label: 'IP_ADDRESS', re: /\b(?:\d{1,3}\.){3}\d{1,3}\b/g },
    { label: 'PERSON', re: /\b((?:[Oo]wner|[Cc]ontact|[Mm]anager|[Ll]ead)\s*:?\s+)([A-Z][a-z]+(?:\s[A-Z][a-z]+)+)/g, group: 2 }
  ];

  function redact(text) {
    const found = [];
    let out = text;
    PII_RULES.forEach(rule => {
      out = out.replace(rule.re, (...args) => {
        const whole = args[0];
        if (rule.group) { const keep = args[1]; found.push({ label: rule.label, value: args[rule.group] }); return `${keep}[${rule.label}]`; }
        found.push({ label: rule.label, value: whole });
        return `[${rule.label}]`;
      });
    });
    return { text: out, found };
  }

  const splitSentences = text => text.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);

  function tagConcepts(text) {
    const { ents } = recognise(text, { generic: false, fuzzy: false });
    const concepts = new Set(), skus = new Set(), regions = new Set();
    ents.forEach(e => {
      if (e.label === 'SERVICE') e.candidates.forEach(c => concepts.add(c.concept.id));
      if (e.label === 'SKU') skus.add(e.text.toLowerCase());
      if (e.label === 'REGION') regions.add(e.region.nimbus);
    });
    return { ents, concepts, skus, regions };
  }

  const K1 = 1.2, B = 0.75;   // standard BM25 settings

  function buildIndex() {
    const chunks = [];
    const redactions = [];
    DOCS.forEach(doc => {
      const red = redact(doc.text);
      red.found.forEach(f => redactions.push({ doc: doc.id, ...f }));
      const sents = splitSentences(red.text);
      let buf = [];
      let n = 0;
      const flush = () => {
        if (!buf.length) return;
        n++;
        const text = buf.join(' ');
        const body = tagConcepts(text);
        const title = tagConcepts(doc.title);
        title.concepts.forEach(c => body.concepts.add(c));
        // the title is added to every chunk so each chunk keeps its context
        const terms = indexTerms(tokenize(`${doc.title}. ${text}`));
        chunks.push({ id: `${doc.id}-c${n}`, doc, n, text, ents: body.ents, concepts: [...body.concepts], skus: [...body.skus], regions: [...body.regions], terms, len: terms.length });
        buf = [];
      };
      // up to 3 sentences or about 48 words per chunk
      sents.forEach(s => {
        const words = (buf.join(' ') + ' ' + s).trim().split(/\s+/).length;
        if (buf.length && (words > 48 || buf.length >= 3)) flush();
        buf.push(s);
      });
      flush();
    });

    const df = new Map();
    chunks.forEach(c => {
      c.tf = new Map();
      c.terms.forEach(t => c.tf.set(t, (c.tf.get(t) || 0) + 1));
      c.tf.forEach((_, t) => df.set(t, (df.get(t) || 0) + 1));
    });
    const N = chunks.length;
    const avgdl = chunks.reduce((s, c) => s + c.len, 0) / N;
    const idf = t => { const n = df.get(t) || 0; return Math.log(1 + (N - n + 0.5) / (n + 0.5)); };
    const tagCount = chunks.reduce((s, c) => s + c.ents.length, 0);
    return { chunks, stats: { N, avgdl, idf, df }, redactions, tagCount };
  }

  const INDEX = buildIndex();

  function bm25(chunk, qterms) {
    let s = 0;
    for (const t of qterms) {
      const f = chunk.tf.get(t);
      if (!f) continue;
      s += INDEX.stats.idf(t) * (f * (K1 + 1)) / (f + K1 * (1 - B + B * chunk.len / INDEX.stats.avgdl));
    }
    return s;
  }

  /* -------------------------------------------------------------------
     STEP 6. Retrieval
     mode 'bm25'    : keyword search on the raw question
     mode 'rewrite' : keyword search on the rewritten question
     mode 'full'    : rewritten question + entity ranking, merged with
                      reciprocal rank fusion (RRF)
     The role filter runs first, so hidden documents are never scored.
     ------------------------------------------------------------------- */
  function retrieve(query, opts = {}) {
    const role = opts.role || 'se';
    const mode = opts.mode || 'full';
    const roleFilter = opts.roleFilter !== false;
    const rec = recognise(query);
    const links = link(rec.ents);
    const rw = rewrite(query, links);
    const visible = INDEX.chunks.filter(c => !roleFilter || c.doc.roles.includes('all') || c.doc.roles.includes(role));
    const hiddenDocs = new Set(INDEX.chunks.filter(c => !visible.includes(c)).map(c => c.doc.id));
    const qterms = [...new Set(indexTerms(tokenize(mode === 'bm25' ? query : rw.text)))];

    const bm = visible.map(c => ({ c, s: bm25(c, qterms) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
    const bmRank = new Map(bm.map((x, i) => [x.c.id, i + 1]));
    const bmScore = new Map(bm.map(x => [x.c.id, x.s]));

    let ent = [];
    if (mode === 'full') {
      const qConcepts = new Set(links.filter(l => l.kind === 'service').map(l => l.concept.id));
      const mainDocs = new Set(links.filter(l => l.kind === 'service' && !l.implied).map(l => l.concept.doc));
      const qSkus = new Set(links.filter(l => l.kind === 'sku' && l.nimbusSku).map(l => l.nimbusSku.code));
      const qRegions = new Set(links.filter(l => l.kind === 'region').map(l => l.region.nimbus));
      ent = visible.map(c => {
        let s = 0;
        c.concepts.forEach(x => { if (qConcepts.has(x)) s += 1; });
        c.skus.forEach(x => { if (qSkus.has(x)) s += 3; });      // exact instance type is the strongest signal
        c.regions.forEach(x => { if (qRegions.has(x)) s += 2; });
        if (s > 0 && mainDocs.has(c.doc.id)) s += 0.5;     // the glossary points to this document
        return { c, s };
      }).filter(x => x.s > 0).sort((a, b) => b.s - a.s || (bmRank.get(a.c.id) || 999) - (bmRank.get(b.c.id) || 999));
    }
    const entRank = new Map(ent.map((x, i) => [x.c.id, i + 1]));

    const RRF_K = 60;
    const fused = new Map();
    const addList = list => list.forEach((x, i) => {
      const cur = fused.get(x.c.id) || { c: x.c, s: 0 };
      cur.s += 1 / (RRF_K + i + 1);
      fused.set(x.c.id, cur);
    });
    addList(bm);
    addList(ent);
    const results = [...fused.values()].sort((a, b) => b.s - a.s).map((x, i) => ({
      chunk: x.c, rank: i + 1, fused: x.s,
      bmRank: bmRank.get(x.c.id) || null, bmScore: bmScore.get(x.c.id) || 0, entRank: entRank.get(x.c.id) || null
    }));
    return { query, mode, role, rec, links, rewrite: rw, qterms, results, hiddenDocs: [...hiddenDocs], visibleCount: visible.length };
  }

  /* -------------------------------------------------------------------
     STEP 7. Answer composition and checks
     Prototype: the answer is built from the best sentences of the top
     chunks with fixed templates. Planned: an LLM writes the answer from
     the same context with the prompt shown in the trace.
     ------------------------------------------------------------------- */
  function answer(query, opts = {}) {
    const settings = Object.assign({ grounded: true, numberCheck: true, roleFilter: true, freshness: true }, opts.settings || {});
    const r = retrieve(query, { role: opts.role, roleFilter: settings.roleFilter });
    const intent = classifyIntent(query, r.rec.ents);
    const links = r.links.filter(l => !l.implied);
    const skuLink = links.find(l => l.kind === 'sku' && l.from !== 'nimbus');
    const ownSku = links.find(l => l.kind === 'sku' && l.from === 'nimbus');
    const svcLinks = [];
    links.filter(l => l.kind === 'service' && l.from !== 'nimbus').sort((a, b) => (b.from ? 1 : 0) - (a.from ? 1 : 0))
      .forEach(l => { if (!svcLinks.some(x => x.concept.id === l.concept.id)) svcLinks.push(l); });
    const regionLink = links.find(l => l.kind === 'region');
    const qset = new Set(r.qterms);
    const focusCodes = [skuLink && skuLink.target, ownSku && ownSku.target].filter(Boolean).map(s => s.toLowerCase());

    // intents with at least 20% probability shape which sentences are preferred
    const likely = new Set(intent.filter(i => i.prob >= 0.2).map(i => i.id));
    const qConcepts = new Set(r.links.filter(l => l.kind === 'service').map(l => l.concept.id));
    const onTopic = chunk => !qConcepts.size || chunk.concepts.some(c => qConcepts.has(c));
    const evidence = [];
    const usedDocs = [];
    const covered = new Set();
    const addEvidence = p => {
      if (!usedDocs.includes(p.chunk.doc.id)) usedDocs.push(p.chunk.doc.id);
      evidence.push(p);
      p.terms.forEach(t => covered.add(t));
    };
    const sentencesOf = (chunk, ri) => splitSentences(chunk.text).map((s, si) => {
      let mult = (1 - 0.08 * ri) * (onTopic(chunk) ? 1 : 0.4);      // other products are down-weighted
      if (focusCodes.some(c => s.toLowerCase().includes(c))) mult *= 3;
      if (likely.has('pricing_policy') && /USD|billed|price|cost|%/i.test(s)) mult *= 1.5;
      if (likely.has('spec_lookup') && /\d/.test(s)) mult *= 1.3;
      return { s, si, chunk, mult, terms: new Set(indexTerms(tokenize(s))) };
    });

    // (a) structured lookup: for an instance type, quote its row from the spec sheet
    const visible = INDEX.chunks.filter(c => !settings.roleFilter || c.doc.roles.includes('all') || c.doc.roles.includes(r.role));
    let specRow = null;
    focusCodes.forEach(code => {
      for (const c of visible.filter(ch => ch.skus.includes(code) && ch.doc.type === 'Spec sheet')) {
        const row = sentencesOf(c, 0).find(x => x.s.toLowerCase().startsWith(code) && /USD/.test(x.s));
        if (row && !evidence.some(e => e.s === row.s)) { addEvidence(row); specRow = { code, doc: c.doc }; break; }
      }
    });

    // (b) greedy coverage over the top 5 chunks: each new sentence must add
    //     query words that are not covered yet (max 3 sentences, 2 documents)
    const pool = [];
    r.results.slice(0, 5).forEach((x, ri) => pool.push(...sentencesOf(x.chunk, ri)));
    // provider names only resolve ambiguity, so they do not count as new content
    const gain = p => { let g = 0; p.terms.forEach(t => { if (qset.has(t) && !covered.has(t) && !PROVIDER_WORDS[t]) g += INDEX.stats.idf(t); }); return g * p.mult; };
    while (evidence.length < 3) {
      const cands = pool.filter(p => !evidence.some(e => e.s === p.s) && (usedDocs.includes(p.chunk.doc.id) || usedDocs.length < 2));
      if (!cands.length) break;
      cands.forEach(p => { p.g = gain(p); });
      cands.sort((a, b) => b.g - a.g);
      if (cands[0].g < 1.5) break;      // nothing new worth adding
      addEvidence(cands[0]);
    }
    // read in a natural order: by source, then by position in the chunk
    evidence.sort((a, b) => usedDocs.indexOf(a.chunk.doc.id) - usedDocs.indexOf(b.chunk.doc.id) || a.chunk.n - b.chunk.n || a.si - b.si);
    const cite = ev => usedDocs.indexOf(ev.chunk.doc.id) + 1;

    const topRes = r.results[0];
    const hasEntityHit = topRes && topRes.entRank;
    // coverage: how much of the question (weighted by IDF) the evidence talks about
    const qWeight = r.qterms.filter(t => !PROVIDER_WORDS[t]).reduce((sum, t) => sum + INDEX.stats.idf(t), 0) || 1;
    const coverage = [...covered].filter(t => qset.has(t) && !PROVIDER_WORDS[t]).reduce((sum, t) => sum + INDEX.stats.idf(t), 0) / qWeight;
    const weak = !topRes || !evidence.length || (coverage < 0.4 && !hasEntityHit);
    const pricingAsked = intent[0].id === 'pricing_policy';
    const priceInEvidence = evidence.some(ev => /USD|%/.test(ev.s));

    const parts = [];
    let abstained = false;
    if (skuLink) {
      const sp = skuLink.spec, n = skuLink.nimbusSku;
      parts.push(`The closest Nimbus match for <strong>${escHtml(skuLink.mention)}</strong>${skuLink.from ? ` (${PROVIDERS[skuLink.from]}, ${sp.vcpu} vCPU, ${sp.mem} GiB${sp.gpu ? `, ${sp.gpu} GPU` : ''})` : ''} is <strong>${n.code}</strong>, ${withArticle(famLabel(n.family))} instance with ${n.vcpu} vCPU and ${n.mem} GiB${n.gpu ? ` and ${n.gpu} GPU` : ''}.`);
    } else if (regionLink) {
      parts.push(`The closest Nimbus region to <strong>${escHtml(regionLink.mention)}</strong> (${PROVIDERS[regionLink.from]}) is <strong>${regionLink.region.nimbus}</strong> in ${regionLink.region.city}.`);
    }
    svcLinks.slice(0, 2).forEach(l => {
      if (skuLink && l.concept.id === 'compute.vm') return;
      if (l.from) parts.push(`In Nimbus Cloud, <strong>${escHtml(l.concept[l.from].name)}</strong> maps to <strong>${escHtml(l.concept.nimbus.name)}</strong>.`);
      else parts.push(`The Nimbus Cloud service for ${escHtml(l.mention.toLowerCase())} is <strong>${escHtml(l.concept.nimbus.name)}</strong>.`);
    });

    if (settings.grounded && weak && !parts.length) {
      abstained = true;
      const hiddenNote = r.hiddenDocs.length ? ` ${r.hiddenDocs.length} document${r.hiddenDocs.length > 1 ? 's are' : ' is'} hidden for your role, so the answer may be in a place you cannot open.` : '';
      parts.push(`I could not find this in the knowledge base you can access.${hiddenNote} Please ask the product specialist team, and use the feedback button so the gap can be fixed.`);
    } else {
      if (settings.grounded && pricingAsked && !priceInEvidence && !skuLink && !ownSku && svcLinks.length) {
        abstained = true;
        const name = svcLinks[0] ? svcLinks[0].concept.nimbus.name : 'this item';
        parts.push(`I could not find a list price for ${escHtml(name)} in the knowledge base, so I will not guess one. Ask the pricing team for a quote.`);
      }
      const ev = evidence.map(e => `${escHtml(e.s)} <span class="cite" data-doc="${e.chunk.doc.id}">${cite(e)}</span>`);
      if (ev.length) parts.push(ev.join(' '));
    }

    const watchConcept = (svcLinks.find(l => !(skuLink && l.concept.id === 'compute.vm')) || {}).concept || (skuLink ? CONCEPTS[0] : null);
    const sources = usedDocs.map((id, i) => { const ev = evidence.find(e => e.chunk.doc.id === id); return { n: i + 1, doc: ev.chunk.doc, chunk: ev.chunk }; });

    // --- guardrail checks ---
    const checks = [];
    const plain = parts.join(' ').replace(/<[^>]+>/g, ' ');
    const citeFree = parts.join(' ').replace(/<span class="cite"[^>]*>\d+<\/span>/g, '').replace(/<[^>]+>/g, ' ');
    // digits inside product codes (gp3, m5.2xlarge) are names, not numbers
    const stripCodes = t => tokenize(t).filter(x => x.protected).sort((a, b) => b.start - a.start)
      .reduce((out, x) => out.slice(0, x.start) + ' ' + out.slice(x.end), t);
    const nums = stripCodes(citeFree).match(/\d+(?:[.,]\d+)*/g) || [];
    const sourceText = [query, ...evidence.map(e => e.chunk.text), skuLink ? JSON.stringify(skuLink.spec) + JSON.stringify(skuLink.nimbusSku) : '', regionLink ? regionLink.region.nimbus : '']
      .join(' ') + ' ' + r.links.map(l => l.mention).join(' ');
    const numsFound = nums.filter(x => sourceText.includes(x));
    if (abstained && !sources.length) checks.push({ status: 'ok', text: 'No claim made without a source (answer withheld)' });
    else checks.push({ status: sources.length ? 'ok' : 'bad', text: `Grounded in ${sources.length} source${sources.length === 1 ? '' : 's'}` });
    if (settings.numberCheck) checks.push({ status: numsFound.length === nums.length ? 'ok' : 'bad', text: `Numbers checked: ${numsFound.length} of ${nums.length} found in the sources or question` });
    if (settings.freshness !== false) {
      sources.forEach(s => {
        const age = daysBetween(s.doc.updated, INDEX_DATE);
        if (age > STALE_DAYS) checks.push({ status: 'warn', text: `"${s.doc.title}" was last updated ${age} days ago; check it is still current` });
      });
      if (!sources.some(s => daysBetween(s.doc.updated, INDEX_DATE) > STALE_DAYS) && sources.length) checks.push({ status: 'ok', text: `All sources updated in the last ${STALE_DAYS} days` });
    }
    checks.push({ status: 'ok', text: settings.roleFilter ? `Access rules applied (${ROLES[r.role]})` : 'Access rules switched off in Trust & Safety' });
    const pii = redact(plain).found;
    checks.push({ status: pii.length ? 'bad' : 'ok', text: pii.length ? `${pii.length} personal data item(s) found in the answer` : 'No personal data in the answer' });

    let confidence = 'Medium';
    if (abstained) confidence = 'Low';
    else if (topRes && topRes.bmRank === 1 && (topRes.entRank === 1 || !r.links.length)) confidence = 'High';

    // --- the prompt a production LLM would receive ---
    const prompt = [
      'SYSTEM: You are CloudLexis, an assistant for Nimbus Cloud employees.',
      'Answer only from the CONTEXT. Use Nimbus product names. Cite sources as [n].',
      'If the CONTEXT does not contain the answer, say so. Never invent prices or specs.',
      '',
      'TERM MAP: ' + (r.links.filter(l => !l.implied).map(l => `${l.mention} -> ${l.target}`).join('; ') || 'none'),
      '',
      'CONTEXT:',
      ...r.results.slice(0, 3).map((x, i) => `[${i + 1}] ${x.chunk.doc.title}: ${x.chunk.text}`),
      '',
      'QUESTION: ' + query
    ].join('\n');

    const usedChunks = [...new Set(evidence.map(e => e.chunk.id))];
    return { r, intent, specRow, usedChunks, coverage, html: parts.map(p => `<p>${p}</p>`).join(''), sources, checks, confidence, abstained, watch: watchConcept && sources.length ? watchConcept.watch : null, links, prompt };
  }

  /* -------------------------------------------------------------------
     Term Translator: rewrite a sentence with Nimbus names.
     ------------------------------------------------------------------- */
  function translateSentence(text) {
    const { ents } = recognise(text, { generic: false });
    const links = link(ents);
    let out = '';
    let pos = 0;
    const reps = [];
    ents.forEach(e => {
      const l = links.find(x => x.ent === e);
      if (!l || !l.from || l.from === 'nimbus') return;
      const target = l.kind === 'service' ? l.concept.nimbus.name : l.kind === 'sku' ? l.target : l.region.nimbus;
      let before = escHtml(text.slice(pos, e.start));
      // fix "a"/"an" in front of the new name
      const vowel = /^[aeiou]/i.test(target) || /^(NES|NOS|NBD|NPN|NTB|NMS|NAM|NCK|NKS)\b/.test(target);
      before = before.replace(/\b(a|an) $/i, (m0, art) => (vowel ? (art[0] === 'A' ? 'An ' : 'an ') : (art[0] === 'A' ? 'A ' : 'a ')));
      out += before + `<mark title="was: ${escHtml(e.text)}">${escHtml(target)}</mark>`;
      reps.push({ from: e.text, to: target, kind: l.kind, provider: l.from, how: l.how });
      pos = e.end;
    });
    out += escHtml(text.slice(pos));
    return { html: out, reps };
  }

  /* -------------------------------------------------------------------
     Offline evaluation on the demo test set (document-level ranks).
     ------------------------------------------------------------------- */
  const MODES = [
    { id: 'bm25', label: 'A. BM25 on the raw question' },
    { id: 'rewrite', label: 'B. + entity linking and query rewrite' },
    { id: 'full', label: 'C. + entity ranking with RRF' }
  ];
  function docRanking(res) { const docs = []; res.results.forEach(x => { if (!docs.includes(x.chunk.doc.id)) docs.push(x.chunk.doc.id); }); return docs; }
  function evaluate() {
    const rows = TEST_SET.map(t => {
      const ranks = {};
      MODES.forEach(m => {
        const i = docRanking(retrieve(t.q, { mode: m.id, roleFilter: false })).indexOf(t.gold);
        ranks[m.id] = i >= 0 ? i + 1 : null;
      });
      return Object.assign({}, t, { ranks });
    });
    const calc = (subset, id) => {
      const n = subset.length || 1;
      return {
        r1: subset.filter(x => x.ranks[id] === 1).length / n,
        r3: subset.filter(x => x.ranks[id] && x.ranks[id] <= 3).length / n,
