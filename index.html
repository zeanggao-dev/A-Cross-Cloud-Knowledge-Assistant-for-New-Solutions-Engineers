        mrr: subset.reduce((s, x) => s + (x.ranks[id] ? 1 / x.ranks[id] : 0), 0) / n
      };
    };
    const summary = MODES.map(m => ({ ...m, all: calc(rows, m.id), cross: calc(rows.filter(r => r.type === 'cross'), m.id), same: calc(rows.filter(r => r.type === 'same'), m.id) }));
    return { rows, summary };
  }

  return { INDEX, INDEX_DATE, STALE_DAYS, INTENTS, MODES, famLabel, withArticle, tokenize, naiveSplit, isStop, recognise, link, classifyIntent, parseSku, familyOf, matchSku, rewrite, retrieve, answer, translateSentence, redact, evaluate, escHtml, daysBetween };
})();
</script>
<script id="cl-app">
/* =====================================================================
   CloudLexis user interface
   ---------------------------------------------------------------------
   Seven pages, switched by the URL hash (#/ask, #/translator, ...).
   Deep links used for the README screenshots:
     #/ask?q=...        ask a question on load (q can repeat)
     #/spec?sku=...     match an instance type on load
     #/kb?doc=D03       open a document in the inspector
     #/eval?run=1       run the evaluation on load
   ===================================================================== */
(() => {
  const E = Engine;
  const esc = E.escHtml;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const main = $('#main');

  // localStorage wrapper: the page still works when storage is blocked
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cloudlexis.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('cloudlexis.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };

  /* ---------- icons (simple stroke icons, 24 x 24) ---------- */
  const ICONS = {
    chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
    translate: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
    cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    send: '<path d="M4 12l16-8-6 16-2-7-8-1z"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
    up: '<path d="M7 11v9H4v-9h3zM7 11l4-8c1.7 0 3 1.3 3 3v3h5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/>',
    down: '<path d="M17 13V4h3v9h-3zM17 13l-4 8c-1.7 0-3-1.3-3-3v-3H5a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 6.2 4H17"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
    alert: '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>',
    table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    refresh: '<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>',
    play: '<path d="M7 4l13 8-13 8z"/>',
    doc: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
    shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    chart: '<path d="M3 21h18M6 17v-6M11 17V6M16 17v-4"/>'
  };
  const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
  const logo = cls => `<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--primary)"/><path d="M6 21c3-7 7-10 10-10s7 3 10 10" stroke="var(--primary-ink)" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M6 21h20M11 21v-4M16 21v-6M21 21v-4" stroke="var(--primary-ink)" stroke-width="2" stroke-linecap="round"/></svg>`;
  const pct = x => `${Math.round(x * 100)}%`;
  const fix = (x, d = 3) => x.toFixed(d);
  const money = x => x.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const roleCan = doc => doc.roles.includes('all') || doc.roles.includes(state.role);
  const accessText = doc => doc.roles.includes('all') ? 'Everyone' : doc.roles.map(r => ROLES[r]).join(', ');

  /* ---------- app state ---------- */
  const state = {
    page: 'ask',
    role: store.get('role', 'se'),
    settings: Object.assign({ grounded: true, numberCheck: true, roleFilter: true, freshness: true }, store.get('settings', {})),
    chat: [],
    traceIdx: null,
    audit: [],
    tasks: store.get('tasks', null),
    selectedConcept: 'compute.vm',
    selectedDoc: 'D03',
    kbType: 'All',
    kbQuery: '',
    glossCat: 'All',
    glossQuery: '',
    tin: null,
    exIdx: 0,
    specQ: 'm5.2xlarge',
    evalResult: null,
    quiz: null,
    flashIdx: 4,
    flashBack: false
  };
  const USER_ID = 'u_5f2a91';   // pseudonymous ID used in the audit log, never a name

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* =================================================================
     Page 1. Ask: chat with answers, sources and a pipeline trace
     ================================================================= */
  const SUGGESTIONS = [
    { title: 'Translate a term', icon: 'translate', items: ['Do we have something like S3 Glacier for cheap archive?', 'What is our version of EBS and how many IOPS can it do?', 'How do I connect two VPCs?'] },
    { title: 'Size a migration', icon: 'cpu', items: ['What is our equivalent of an AWS EC2 m5.2xlarge?', 'Customer uses Standard_F8s_v2 on Azure, what do we have?', 'Which Nimbus region is closest to AWS me-central-1?'] },
    { title: 'Policy and process', icon: 'book', items: ['What discount can I give without approval?', 'How much POC credit can a new customer get?', 'How much does a Redshift node cost in Nimbus?'] }
  ];

  function renderAsk(params) {
    main.innerHTML = `
      <div class="page-head">
        <div><h1>Ask CloudLexis</h1><p class="sub">Ask in AWS, Azure or Google Cloud words. Answers come back in Nimbus Cloud terms, with sources you can open.</p></div>
        <div class="head-actions">
          <span class="badge badge-outline">${icon('layers', 'ic-sm')} ${DOCS.length} documents · ${E.INDEX.chunks.length} chunks · ${CONCEPTS.length} concepts</span>
          <button class="btn btn-sm" id="newChat">${icon('plus', 'ic-sm')} New chat</button>
        </div>
      </div>
      <div class="ask-grid">
        <section class="card chat">
          <div class="chat-log" id="chatLog"></div>
          <form class="composer" id="composer">
            <input id="q" placeholder="e.g. What is our equivalent of an AWS m5.2xlarge?" autocomplete="off" aria-label="Your question">
            <button class="btn btn-primary" type="submit">${icon('send')} Ask</button>
          </form>
          <div class="composer-hint">Prototype: answers are built from retrieved sentences with templates. No large language model is called in this demo.</div>
        </section>
        <aside class="card trace" id="trace" aria-label="Pipeline trace"></aside>
      </div>`;
    $('#composer').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) ask(q); });
    $('#newChat').addEventListener('click', () => { state.chat = []; state.traceIdx = null; renderChat(); renderTrace(); });
    const qs = params.getAll('q');
    if (qs.length) { history.replaceState(null, '', '#/ask'); qs.forEach(q => ask(q, true)); }
    renderChat();
    renderTrace();
    if (!qs.length) $('#q').focus({ preventScroll: true });
  }

  function ask(q, instant = false) {
    const a = E.answer(q, { role: state.role, settings: state.settings });
    const entry = { q, a, feedback: null, time: new Date(), pending: !instant };
    state.chat.push(entry);
    state.traceIdx = state.chat.length - 1;
    state.audit.unshift({ time: entry.time, q: E.redact(q).text, role: state.role, intent: a.intent[0].label, sources: a.sources.map(s => s.doc.id), confidence: a.confidence, entry });
    if ($('#q')) $('#q').value = '';
    if (instant) return;
    renderChat();
    renderTrace();
    setTimeout(() => { entry.pending = false; renderChat(); renderTrace(); }, 450);
  }

  function welcomeHtml() {
    return `<div class="welcome">
      <h2>Ask in any cloud’s language</h2>
      <p>CloudLexis finds the Nimbus product, the right document and the exact numbers. Try one of these:</p>
      <div class="suggest-groups">${SUGGESTIONS.map(g => `
        <div class="suggest-group"><h3>${icon(g.icon, 'ic-sm')} ${g.title}</h3>
          ${g.items.map(q => `<button class="chip suggest" data-q="${esc(q)}">${esc(q)}</button>`).join('')}
        </div>`).join('')}
      </div></div>`;
  }

  function answerHtml(m, i) {
    const a = m.a;
    const seen = new Set();
    const maps = a.links.filter(l => l.from !== 'nimbus').map(l => {
      const to = l.kind === 'service' ? (l.concept.nimbus.short || l.concept.nimbus.name) : l.kind === 'region' ? l.region.nimbus : l.target;
      if (seen.has(to)) return '';
      seen.add(to);
      return `<span class="map-chip"><span class="from">${esc(l.mention)}</span>${icon('arrow', 'ic-sm')}<span class="to">${esc(to)}</span></span>`;
    }).join('');
    const confCls = { High: 'badge-ok', Medium: 'badge-warn', Low: 'badge-danger' }[a.confidence];
    const nc = a.checks.find(c => c.text.startsWith('Numbers'));
    const ncm = nc && nc.text.match(/(\d+) of (\d+)/);
    const stale = a.checks.some(c => c.status === 'warn');
    return `<div class="answer" data-i="${i}">
      ${maps ? `<div class="map-chips">${maps}</div>` : ''}
      <div class="answer-text">${a.html}</div>
      ${a.watch ? `<div class="watch">${icon('alert')}<div><b>Watch out.</b> ${esc(a.watch)}</div></div>` : ''}
      ${a.sources.length ? `<div class="sources">${a.sources.map(s => `
        <div class="source" data-doc="${s.doc.id}" role="link" tabindex="0"><span class="cite">${s.n}</span>
          <div><div>${esc(s.doc.title)}</div><div class="meta">${esc(s.doc.type)} · updated ${s.doc.updated} · ${s.doc.sensitivity}</div></div>${icon('chevron', 'ic-sm')}</div>`).join('')}</div>` : ''}
      <div class="answer-foot">
        <span class="badge ${confCls}">Confidence: ${a.confidence}</span>
        ${ncm && +ncm[2] > 0 ? `<span class="badge ${ncm[1] === ncm[2] ? 'badge-ok' : 'badge-danger'}">${icon('check', 'ic-sm')} ${ncm[1]}/${ncm[2]} numbers checked</span>` : ''}
        ${stale ? `<span class="badge badge-warn">${icon('clock', 'ic-sm')} Source may be out of date</span>` : ''}
        <span class="spacer"></span>
        <span class="row" style="gap:4px;flex-wrap:nowrap">
        <button class="btn btn-sm btn-ghost" data-act="trace">${icon('route', 'ic-sm')} Trace</button>
        <button class="icon-btn" data-act="copy" title="Copy answer" aria-label="Copy answer">${icon('copy', 'ic-sm')}</button>
        <button class="icon-btn" data-act="up" title="Helpful" aria-label="Helpful" style="${m.feedback === 'up' ? 'color:var(--ok);border-color:var(--ok)' : ''}">${icon('up', 'ic-sm')}</button>
        <button class="icon-btn" data-act="down" title="Not helpful" aria-label="Not helpful" style="${m.feedback === 'down' ? 'color:var(--danger);border-color:var(--danger)' : ''}">${icon('down', 'ic-sm')}</button></span>
      </div></div>`;
  }

  function renderChat() {
    const log = $('#chatLog');
    if (!log) return;
    if (!state.chat.length) {
      log.innerHTML = welcomeHtml();
      $$('.suggest', log).forEach(b => b.addEventListener('click', () => ask(b.dataset.q)));
      return;
    }
    log.innerHTML = state.chat.map((m, i) => `
      <div class="msg-user">${esc(m.q)}</div>
      <div class="msg-bot">${logo('bot-avatar')}${m.pending ? '<div class="answer"><span class="typing"><i></i><i></i><i></i></span></div>' : answerHtml(m, i)}</div>`).join('');
    $$('.source, .cite', log).forEach(el => el.addEventListener('click', () => { location.hash = `#/kb?doc=${el.dataset.doc}`; }));
    $$('.answer[data-i]', log).forEach(card => {
      const i = +card.dataset.i, m = state.chat[i];
      $$('[data-act]', card).forEach(btn => btn.addEventListener('click', () => {
        const act = btn.dataset.act;
        if (act === 'trace') { state.traceIdx = i; renderTrace(); toast('Trace shows this answer'); }
        if (act === 'copy') {
          const text = card.querySelector('.answer-text').innerText;
          try { navigator.clipboard.writeText(text).then(() => toast('Answer copied'), () => toast('Copy is not allowed here')); } catch (e) { toast('Copy is not allowed here'); }
        }
        if (act === 'up' || act === 'down') {
          m.feedback = act;
          const row = state.audit.find(x => x.entry === m);
          if (row) row.feedback = act;
          renderChat();
          toast(act === 'up' ? 'Thanks. Marked as helpful.' : 'Thanks. Sent to the content owners for review.');
        }
      }));
    });
    log.scrollTop = log.scrollHeight;
  }

  function markEntities(text, ents) {
    let out = '', pos = 0;
    ents.forEach(e => {
      if (e.start < pos) return;
      out += esc(text.slice(pos, e.start)) + `<span class="ent ent-${e.label}" title="${e.label}${e.fuzzy ? ' (fuzzy)' : ''}">${esc(e.text)}<small>${e.label}</small></span>`;
      pos = e.end;
    });
    return out + esc(text.slice(pos));
  }
  const legendHtml = () => `<div class="legend">${['PROVIDER', 'SERVICE', 'SKU', 'SPEC', 'REGION'].map(l => `<span><i class="ent-${l}" style="background:var(--ent-${l.toLowerCase()})"></i>${l}</span>`).join('')}</div>`;

  const step = (n, title, what, body, planned) => `
    <div class="step"><div class="step-n">${n}</div><div>
      <h3>${title}</h3><p class="what">${what}</p>${body}
      ${planned ? `<div class="planned">${icon('info', 'ic-sm')}<span>${planned}</span></div>` : ''}
    </div></div>`;

  function renderTrace() {
    const box = $('#trace');
    if (!box) return;
    const m = state.chat[state.traceIdx];
    if (!m || m.pending) {
      box.innerHTML = `<div class="card-head"><div><h2>How the answer is built</h2><p>Every step of the NLP and RAG pipeline for the selected answer.</p></div></div>
        <div class="trace-body"><div class="empty">${icon('route')}<p style="margin-top:8px">Ask a question to see the seven steps: tokenise, intent, entities, linking, rewrite, retrieval and checks.</p></div></div>`;
      return;
    }
    const a = m.a, r = a.r;
    const toks = r.rec.tokens.map(t => `<span class="tok${t.protected ? ' protected' : ''}${E.isStop(t) ? ' stop' : ''}" title="${t.protected ? 'kept as one token' : E.isStop(t) ? 'stop word, not used for keyword search' : 'token'}">${esc(t.text)}</span>`).join('');
    const broken = r.rec.tokens.filter(t => t.protected).map(t => `<div class="broken">A plain word splitter would give: ${E.naiveSplit(t.text).map(x => `<span class="tok">${esc(x)}</span>`).join(' ')}</div>`).join('');
    const intents = a.intent.slice(0, 4).map((it, i) => `<div class="intent-row${i === 0 ? ' top' : ''}"><span>${it.label}</span><div class="bar"><i style="width:${(it.prob * 100).toFixed(0)}%"></i></div><span class="num">${pct(it.prob)}</span></div>`).join('');
    const links = r.links.length ? r.links.map(l => `
      <div class="link-row"><span>${esc(l.mention)} <span class="muted small">${l.from ? PROVIDERS[l.from] : 'generic'}</span></span>${icon('arrow', 'ic-sm')}<b class="nimbus-cell">${esc(l.target)}</b><span class="how">${esc(l.how)}</span></div>`).join('')
      : '<p class="muted small">No product names found, so the question is searched as written.</p>';
    const rows = r.results.slice(0, 5).map((x, i) => `
      <tr class="${a.usedChunks.includes(x.chunk.id) ? 'used' : ''}">
        <td>${i + 1}</td><td><a href="#/kb?doc=${x.chunk.doc.id}">${esc(x.chunk.doc.title)}</a> <span class="muted">#${x.chunk.n}</span></td>
        <td class="num">${x.bmRank ?? '–'}</td><td class="num">${x.entRank ?? '–'}</td><td class="num">${fix(x.fused, 4)}</td></tr>`).join('');
    const filt = state.settings.roleFilter
      ? `Access filter for ${ROLES[r.role]}: ${r.visibleCount} of ${E.INDEX.chunks.length} chunks can be searched${r.hiddenDocs.length ? `, ${r.hiddenDocs.length} documents hidden` : ''}.`
      : 'Access filter is switched off in Trust & Safety.';
    const spec = a.specRow ? `<p class="small" style="margin-top:8px;display:flex;gap:6px">${icon('table', 'ic-sm')}<span>Structured lookup: the row for <code>${a.specRow.code}</code> is read from “${esc(a.specRow.doc.title)}”.</span></p>` : '';
    const checks = a.checks.map(c => `<div class="check ${c.status}">${icon(c.status === 'ok' ? 'check' : c.status === 'warn' ? 'alert' : 'x')}<span>${esc(c.text)}</span></div>`).join('');

    box.innerHTML = `
      <div class="card-head"><div><h2>How the answer is built</h2><p>${esc(m.q)}</p></div><span class="badge badge-primary">7 steps</span></div>
      <div class="trace-body">
        ${step(1, 'Tokenise', 'Split the question into tokens. Product codes and regions stay in one piece; faded tokens are stop words.', `<div class="tokens">${toks}</div>${broken}`, 'Planned: spaCy tokenizer with the same custom rules')}
        ${step(2, 'Classify intent', 'Decide what kind of question this is. The intent changes which sentences are preferred and which checks run.', intents, 'Prototype: keyword model. Planned: DistilBERT fine-tuned on labelled questions')}
        ${step(3, 'Recognise entities', 'Find providers, services, instance types (SKU), specs and regions.', `<div class="qtext">${markEntities(r.query, r.rec.ents)}</div>${legendHtml()}`, 'Prototype: glossary, patterns and fuzzy matching. Planned: add a fine-tuned BERT NER model for new names')}
        ${step(4, 'Link to Nimbus terms', 'Tie each mention to one concept in the cross-cloud glossary.', links, 'Order: exact alias, then fuzzy match; planned: embedding similarity as a last step')}
        ${step(5, 'Rewrite the query', 'Add the Nimbus names, so keyword search can reach Nimbus documents.', `<div class="rewrite">${esc(r.query)}${r.rewrite.added.map(x => ` <mark>${esc(x)}</mark>`).join('')}</div>`, '')}
        ${step(6, 'Retrieve and rank', filt, `<table class="mini-table"><thead><tr><th>#</th><th>Chunk</th><th class="num">BM25</th><th class="num">Entity</th><th class="num">RRF</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">No matching chunks</td></tr>'}</tbody></table>${spec}`, 'Planned: add dense retrieval (bge-small-en-v1.5) to the fusion and a cross-encoder reranker')}
        ${step(7, 'Generate and check', 'Write the answer from the retrieved text only, then check it before it is shown.', `${checks}<details class="prompt"><summary>Show the prompt a production LLM would receive</summary><pre>${esc(a.prompt)}</pre></details>`, 'Prototype: template answer. Planned: Llama 3.1 8B Instruct, self-hosted')}
      </div>`;
  }

  /* =================================================================
     Page 2. Term Translator: sentence rewrite + glossary
     ================================================================= */
  const EXAMPLES = [
    'The customer runs 40 m5.2xlarge EC2 instances behind an ALB in us-east-1 and keeps old logs in S3 Glacier.',
    'They use AKS with Azure Monitor and keep their secrets in Key Vault in uaenorth.',
    'Files land in Cloud Storage, Cloud Run functions clean them, and the results are loaded into BigQuery.'
  ];

  function renderTranslator() {
    if (state.tin === null) state.tin = EXAMPLES[0];
    main.innerHTML = `
      <div class="page-head"><div><h1>Term Translator</h1><p class="sub">Paste a sentence from a customer email or call note. Product names from other clouds are swapped for Nimbus names.</p></div></div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-head"><div><h2>Translate a sentence</h2><p>Uses the same entity recognition and linking as Ask.</p></div></div>
        <div class="card-body grid g-2">
          <div>
            <label class="small muted" for="tin">Customer wording</label>
            <textarea class="textarea" id="tin" style="margin-top:4px">${esc(state.tin)}</textarea>
            <div class="row" style="margin-top:8px">
              <button class="btn btn-primary btn-sm" id="tgo">${icon('translate', 'ic-sm')} Translate</button>
              <button class="btn btn-sm" id="tex">${icon('refresh', 'ic-sm')} Another example</button>
            </div>
          </div>
          <div>
            <span class="small muted">In Nimbus terms</span>
            <div class="translated" id="tout" style="margin-top:4px"></div>
            <div id="treps" style="margin-top:10px"></div>
          </div>
        </div>
      </div>
      <div class="grid g-main-side">
        <div class="card">
          <div class="card-head"><div><h2>Cross-cloud glossary</h2><p>${CONCEPTS.length} concepts across four providers. Click a row for details.</p></div>
            <input class="input" id="gq" placeholder="Search any name, e.g. vnet" style="max-width:220px" value="${esc(state.glossQuery)}" aria-label="Search glossary"></div>
          <div class="card-body" style="padding-bottom:4px"><div class="row" id="gcats"></div></div>
          <div class="table-wrap"><table class="table" id="gtable"></table></div>
        </div>
        <div class="card" id="gdetail"></div>
      </div>`;
    const run = () => {
      state.tin = $('#tin').value;
      const t = E.translateSentence(state.tin);
      $('#tout').innerHTML = t.html || '<span class="muted">Nothing to translate.</span>';
      $('#treps').innerHTML = t.reps.length
        ? `<table class="mini-table"><thead><tr><th>Found</th><th>Type</th><th>Nimbus name</th></tr></thead><tbody>${t.reps.map(x => `<tr><td>${esc(x.from)} <span class="muted">${PROVIDERS[x.provider] || ''}</span></td><td>${x.kind === 'sku' ? 'Instance type' : x.kind === 'region' ? 'Region' : 'Service'}</td><td class="nimbus-cell">${esc(x.to)}</td></tr>`).join('')}</tbody></table>`
        : '<p class="small muted">No product names from other clouds found.</p>';
    };
    $('#tgo').addEventListener('click', run);
    $('#tex').addEventListener('click', () => { state.exIdx = (state.exIdx + 1) % EXAMPLES.length; $('#tin').value = EXAMPLES[state.exIdx]; run(); });
    run();

    const cats = ['All', ...new Set(CONCEPTS.map(c => c.category))];
    $('#gcats').innerHTML = cats.map(c => `<button class="chip${c === state.glossCat ? ' active' : ''}" data-c="${c}">${c}</button>`).join('');
    $$('#gcats .chip').forEach(b => b.addEventListener('click', () => { state.glossCat = b.dataset.c; renderTranslator(); }));
    $('#gq').addEventListener('input', e => { state.glossQuery = e.target.value; drawGlossary(); });
    drawGlossary();
  }

  function drawGlossary() {
    const q = state.glossQuery.trim().toLowerCase();
    const hl = s => { if (!q) return esc(s); const i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + `<span class="hit">${esc(s.slice(i, i + q.length))}</span>` + esc(s.slice(i + q.length)); };
    const rows = CONCEPTS.filter(c => (state.glossCat === 'All' || c.category === state.glossCat) &&
      (!q || ['aws', 'azure', 'gcp', 'nimbus'].some(p => c[p].name.toLowerCase().includes(q) || c[p].aliases.some(a => a.includes(q))) || c.generic.some(a => a.includes(q))));
    const cell = (c, p) => `<div class="provider-cell">${hl(c[p].name)}</div>`;
    $('#gtable').innerHTML = `<thead><tr><th>Concept</th><th>AWS</th><th>Azure</th><th>Google Cloud</th><th>Nimbus Cloud</th></tr></thead><tbody>${rows.map(c => `
      <tr class="clickable${c.id === state.selectedConcept ? ' selected' : ''}" data-id="${c.id}">
        <td><div class="provider-cell"><b>${esc(c.category)}</b><div class="alias">${esc(c.plain)}</div></div></td>
        <td>${cell(c, 'aws')}</td><td>${cell(c, 'azure')}</td><td>${cell(c, 'gcp')}</td><td class="nimbus-cell">${hl(c.nimbus.name)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No match</td></tr>'}</tbody>`;
    $$('#gtable tr.clickable').forEach(tr => tr.addEventListener('click', () => { state.selectedConcept = tr.dataset.id; drawGlossary(); }));
    drawConcept();
  }

  function drawConcept() {
    const c = CONCEPTS.find(x => x.id === state.selectedConcept);
    const doc = DOCS.find(d => d.id === c.doc);
    const aliases = [...new Set(['aws', 'azure', 'gcp', 'nimbus'].flatMap(p => c[p].aliases).concat(c.generic))];
    $('#gdetail').innerHTML = `
      <div class="card-head"><div class="detail-title"><div><span class="badge badge-primary">${esc(c.category)}</span><h2 style="margin-top:8px">${esc(c.nimbus.name)}</h2></div></div></div>
      <div class="card-body stack">
        <p>${esc(c.plain)}</p>
        <dl class="kv">
          <dt>AWS</dt><dd>${esc(c.aws.name)}</dd>
          <dt>Azure</dt><dd>${esc(c.azure.name)}</dd>
          <dt>Google Cloud</dt><dd>${esc(c.gcp.name)}</dd>
          <dt>Main document</dt><dd><a href="#/kb?doc=${doc.id}">${esc(doc.title)}</a></dd>
        </dl>
        <div class="watch">${icon('alert')}<div><b>Watch out.</b> ${esc(c.watch)}</div></div>
        <div><div class="small muted" style="margin-bottom:6px">Spellings the entity recogniser understands (${aliases.length})</div>
          <div class="tag-list">${aliases.map(a => `<span class="badge">${esc(a)}</span>`).join('')}</div></div>
        <button class="btn btn-sm" id="askConcept">${icon('chat', 'ic-sm')} Ask about ${esc(c.aws.name)}</button>
      </div>`;
    $('#askConcept').addEventListener('click', () => { location.hash = '#/ask?q=' + encodeURIComponent(`What is our version of ${c.aws.name}?`); });
  }

  /* =================================================================
     Page 3. Spec Matcher: one instance or a whole inventory
     ================================================================= */
  const QUICK = ['m5.2xlarge', 'r5.4xlarge', 'Standard_F8s_v2', 'n2-highmem-8', 'g5.2xlarge', 'Standard_NC8as_T4_v3', '16 vCPU 64 GB'];
  const BULK_SAMPLE = ['web-01, m5.2xlarge, 6', 'web-02, m5.xlarge, 4', 'api-01, c5.2xlarge, 3', 'db-01, r5.4xlarge, 2', 'ml-01, g5.2xlarge, 1', 'batch-01, Standard_F16s_v2, 2', 'analytics-01, n2-highmem-8, 2'].join('\n');
  const HOURS_PER_MONTH = 730;

  // Read specs from free text: a product code first, otherwise "8 vCPU 32 GB"
  function readSpec(text) {
    const { ents } = E.recognise(text);
    const sku = ents.find(e => e.label === 'SKU');
    if (sku) { const s = E.parseSku(sku.text, sku.provider); if (s) return { ...s, code: sku.text, provider: sku.provider }; }
    const v = ents.find(e => e.label === 'SPEC' && e.unit === 'vcpu'), m = ents.find(e => e.label === 'SPEC' && e.unit === 'mem'), g = ents.find(e => e.label === 'SPEC' && e.unit === 'gpu');
    if (v && m) return { vcpu: v.value, mem: m.value, gpu: g ? g.value : 0, code: text.trim(), provider: null, source: 'specs you typed' };
    return null;
  }

  function renderSpec(params) {
    if (params.get('sku')) { state.specQ = params.get('sku'); history.replaceState(null, '', '#/spec'); }
    main.innerHTML = `
      <div class="page-head"><div><h1>Spec Matcher</h1><p class="sub">Find the closest Nimbus Elastic Server type for an instance from another cloud, or size a whole customer inventory at once.</p></div></div>
      <div class="grid g-2 spec-grid">
        <div class="card">
          <div class="card-head"><div><h2>Find the closest instance type</h2><p>Type a product code or plain specs, e.g. “16 vCPU 64 GB”.</p></div></div>
          <div class="card-body stack">
            <form class="row" id="specForm" style="flex-wrap:nowrap"><input class="input" id="specIn" value="${esc(state.specQ)}" aria-label="Instance type or specs"><button class="btn btn-primary">${icon('search', 'ic-sm')} Match</button></form>
            <div class="row">${QUICK.map(q => `<button class="chip" data-q="${q}">${q}</button>`).join('')}</div>
            <div id="specParsed"></div>
            <div id="specResults"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2>Bulk sizing</h2><p>One line per server: name, instance type, count.</p></div></div>
          <div class="card-body stack">
            <textarea class="textarea mono" id="bulkIn" style="min-height:150px" aria-label="Inventory">${esc(BULK_SAMPLE)}</textarea>
            <div class="row"><button class="btn btn-primary btn-sm" id="bulkGo">${icon('play', 'ic-sm')} Size all</button><button class="btn btn-sm" id="bulkCsv">${icon('download', 'ic-sm')} Download CSV</button></div>
            <div id="bulkOut"></div>
            <p class="small muted">List prices are demo values. Real quotes go through Deal Desk.</p>
          </div>
        </div>
      </div>`;
    $('#specForm').addEventListener('submit', e => { e.preventDefault(); state.specQ = $('#specIn').value; drawMatch(); });
    $$('[data-q]').forEach(b => b.addEventListener('click', () => { state.specQ = b.dataset.q; $('#specIn').value = b.dataset.q; drawMatch(); }));
    $('#bulkGo').addEventListener('click', drawBulk);
    $('#bulkCsv').addEventListener('click', downloadCsv);
    drawMatch();
    drawBulk();
  }

  function drawMatch() {
    const spec = readSpec(state.specQ);
    if (!spec) {
      $('#specParsed').innerHTML = `<div class="callout callout-warn">${icon('alert')}<div>I could not read a product code or specs. Try “m5.2xlarge” or “8 vCPU 32 GB”.</div></div>`;
      $('#specResults').innerHTML = '';
      return;
    }
    const fam = E.familyOf(spec);
    $('#specParsed').innerHTML = `<div class="spec-parsed">
      <div><span>Provider</span><b>${spec.provider ? PROVIDERS[spec.provider] : 'Typed specs'}</b></div>
      <div><span>vCPU</span><b>${spec.vcpu}</b></div>
      <div><span>Memory</span><b>${spec.mem} GiB</b></div>
      <div><span>GPU</span><b>${spec.gpu || 0}</b></div>
      <div><span>Family</span><b style="font-size:13px;margin-top:3px">${FAMILY_NAMES[fam]}</b></div></div>
      <p class="small muted" style="margin-top:6px">Specs from: ${esc(spec.source)}.</p>`;
    const res = E.matchSku(spec).slice(0, 3);
    $('#specResults').innerHTML = res.map((m, i) => `
      <div class="match">
        <div>${i === 0 ? '<div class="best-label">Best match</div>' : ''}
          <div class="code">${m.sku.code}</div>
          <div class="small muted">${FAMILY_NAMES[m.sku.family]} · ${m.sku.vcpu} vCPU · ${m.sku.mem} GiB${m.sku.gpu ? ` · ${m.sku.gpu} GPU` : ''} · ${m.sku.net}</div>
          <div class="why">${m.reasons.map(r => `<span class="badge ${r.ok ? 'badge-ok' : 'badge-warn'}">${icon(r.ok ? 'check' : 'alert', 'ic-sm')} ${esc(r.t)}</span>`).join('')}</div>
        </div>
        <div class="score"><b>${m.score}%</b><div class="small muted">spec match</div><div class="bar" style="margin:6px 0"><i style="width:${m.score}%"></i></div>
          <div class="small">${m.sku.price.toFixed(3)} USD/h · ${money(m.sku.price * HOURS_PER_MONTH)}/mo</div></div>
      </div>`).join('');
  }

  function sizeInventory() {
    return $('#bulkIn').value.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const [name, code = '', countRaw] = line.split(',').map(x => x.trim());
      const count = Math.max(1, parseInt(countRaw, 10) || 1);
      const tok = E.tokenize(code).find(t => t.protected && t.kind === 'sku');
      const spec = tok ? E.parseSku(tok.text, tok.provider) : null;
      if (!spec) return { name, code, count, error: true };
      const best = E.matchSku(spec)[0];
      return { name, code, count, provider: tok.provider, spec, best, monthly: count * HOURS_PER_MONTH * best.sku.price };
    });
  }

  function drawBulk() {
    const rows = sizeInventory();
    const total = rows.reduce((s, r) => s + (r.monthly || 0), 0);
    $('#bulkOut').innerHTML = `<div class="table-wrap"><table class="table"><thead><tr><th>Server</th><th>From</th><th>Nimbus type</th><th class="num">Match</th><th class="num">Est. per month</th></tr></thead><tbody>
      ${rows.map(r => r.error ? `<tr><td>${esc(r.name)}</td><td colspan="4" class="muted">Could not read “${esc(r.code)}”</td></tr>` : `
        <tr><td>${esc(r.name)} <span class="muted">×${r.count}</span></td><td><span class="mono nowrap">${esc(r.code)}</span><div class="small muted">${PROVIDERS[r.provider]} · ${r.spec.vcpu}/${r.spec.mem}</div></td>
        <td class="mono nimbus-cell nowrap">${r.best.sku.code}</td><td class="num">${r.best.score}%</td><td class="num">${money(r.monthly)}</td></tr>`).join('')}
      <tr><td colspan="4"><b>Total list price</b></td><td class="num"><b>${money(total)}</b></td></tr></tbody></table></div>`;
  }

  function downloadCsv() {
    const rows = sizeInventory().filter(r => !r.error);
    const csv = ['server,source_type,provider,count,nimbus_type,match_percent,est_monthly_usd',
      ...rows.map(r => [r.name, r.code, PROVIDERS[r.provider], r.count, r.best.sku.code, r.best.score, r.monthly.toFixed(2)].join(','))].join('\n');
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = 'nimbus-sizing.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Sizing sheet downloaded');
    } catch (e) { toast('Download is not allowed here'); }
  }

  /* =================================================================
     Page 4. Knowledge Base: ingestion pipeline, documents, inspector
     ================================================================= */
  function renderKB(params) {
    if (params.get('doc')) { state.selectedDoc = params.get('doc'); history.replaceState(null, '', '#/kb'); }
    const I = E.INDEX;
    const pstep = (name, detail, badge, cls = 'badge-ok') => `<div class="pstep"><b>${name}</b><span>${detail}</span><div><span class="badge ${cls}">${badge}</span></div></div>`;
    main.innerHTML = `
      <div class="page-head"><div><h1>Knowledge Base</h1><p class="sub">The documents CloudLexis can search, how they are prepared, and who may read them.</p></div>
        <div class="head-actions"><button class="btn btn-sm" id="reindex">${icon('refresh', 'ic-sm')} Rebuild index</button></div></div>
      <div class="grid g-4" style="margin-bottom:16px">
        <div class="card stat"><div class="label">Documents</div><div class="value">${DOCS.length}</div><div class="hint">${DOCS.filter(roleCan).length} visible to ${ROLES[state.role]}</div></div>
        <div class="card stat"><div class="label">Chunks</div><div class="value">${I.chunks.length}</div><div class="hint">up to 3 sentences each</div></div>
        <div class="card stat"><div class="label">Entity tags</div><div class="value">${I.tagCount}</div><div class="hint">added at index time</div></div>
        <div class="card stat"><div class="label">Personal data redacted</div><div class="value">${I.redactions.length}</div><div class="hint">before anything is indexed</div></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-head"><div><h2>Ingestion pipeline</h2><p>Runs every night and whenever a document owner publishes a change. Index built ${E.INDEX_DATE}.</p></div></div>
        <div class="card-body"><div class="pipeline">
          ${pstep('1 Parse', 'HTML, Markdown, PDF to text; keep headings and tables', `${DOCS.length} docs`)}
          ${pstep('2 Clean', 'Remove menus and footers; fix spacing and Unicode', 'done')}
          ${pstep('3 Redact', 'E-mails, phones, keys and names become tags', `${I.redactions.length} items`)}
          ${pstep('4 Chunk', 'Split by sentence; title added to each chunk', `${I.chunks.length} chunks`)}
          ${pstep('5 Tag', 'Entity recogniser marks products, types, regions', `${I.tagCount} tags`)}
          ${pstep('6 Embed', 'bge-small-en-v1.5, 384 numbers per chunk', 'planned', 'badge-outline')}
          ${pstep('7 Index', 'BM25 keyword index; vector index planned', 'BM25 ready')}
        </div></div>
      </div>
      <div class="grid g-main-side">
        <div class="card">
          <div class="card-head"><div><h2>Documents</h2><p>Access rules are stored with each chunk and applied before search.</p></div>
            <input class="input" id="kbq" placeholder="Filter by title" style="max-width:200px" value="${esc(state.kbQuery)}" aria-label="Filter documents"></div>
          <div class="card-body" style="padding-bottom:4px"><div class="row" id="kbtypes"></div></div>
          <div class="table-wrap"><table class="table" id="kbtable"></table></div>
        </div>
        <div class="stack">
          <div class="card" id="inspector"></div>
          <div class="card">
            <div class="card-head"><div><h2>Try the redaction step</h2><p>The same rules run on every document before indexing.</p></div></div>
            <div class="card-body stack">
              <textarea class="textarea" id="redIn">Contact: Omar Haddad, omar.h@example.com, +971 55 123 4567. Test key AKIAIOSFODNN7EXAMPLE on host 10.0.4.12.</textarea>
              <button class="btn btn-sm" id="redGo" style="align-self:flex-start">${icon('shield', 'ic-sm')} Redact</button>
              <div class="translated" id="redOut"></div>
            </div>
          </div>
        </div>
      </div>`;
    const types = ['All', ...new Set(DOCS.map(d => d.type))];
    $('#kbtypes').innerHTML = types.map(t => `<button class="chip${t === state.kbType ? ' active' : ''}" data-t="${t}">${t}</button>`).join('');
    $$('#kbtypes .chip').forEach(b => b.addEventListener('click', () => { state.kbType = b.dataset.t; renderKB(new URLSearchParams()); }));
    $('#kbq').addEventListener('input', e => { state.kbQuery = e.target.value; drawDocs(); });
    $('#reindex').addEventListener('click', () => toast(`Index rebuilt: ${I.chunks.length} chunks, ${I.tagCount} entity tags`));
    const runRedact = () => {
      const r = E.redact($('#redIn').value);
      $('#redOut').innerHTML = esc(r.text).replace(/\[([A-Z_]+)\]/g, '<span class="redacted">[$1]</span>') + `<div class="small muted" style="margin-top:6px">${r.found.length} item(s) redacted</div>`;
    };
    $('#redGo').addEventListener('click', runRedact);
    runRedact();
    drawDocs();
  }

  function drawDocs() {
    const q = state.kbQuery.trim().toLowerCase();
    const docs = DOCS.filter(d => (state.kbType === 'All' || d.type === state.kbType) && (!q || d.title.toLowerCase().includes(q)));
    const sensCls = { Public: 'badge-ok', Internal: 'badge-primary', Confidential: 'badge-accent' };
    $('#kbtable').innerHTML = `<thead><tr><th>Title</th><th>Access</th><th>Level</th><th>Updated</th><th class="num">Chunks</th></tr></thead><tbody>${docs.map(d => {
      const age = E.daysBetween(d.updated, E.INDEX_DATE);
      return `<tr class="clickable${d.id === state.selectedDoc ? ' selected' : ''}" data-id="${d.id}">
        <td><div>${roleCan(d) ? '' : icon('lock', 'ic-sm') + ' '}${esc(d.title)}</div><div class="small muted">${d.id} · ${esc(d.type)}</div></td>
        <td class="small">${esc(accessText(d))}</td>
        <td><span class="badge ${sensCls[d.sensitivity]}">${d.sensitivity}</span></td>
        <td class="small">${d.updated}${age > E.STALE_DAYS ? ` <span class="badge badge-warn">${age}d</span>` : ''}</td>
        <td class="num">${E.INDEX.chunks.filter(c => c.doc.id === d.id).length}</td></tr>`;
    }).join('')}</tbody>`;
    $$('#kbtable tr.clickable').forEach(tr => tr.addEventListener('click', () => { state.selectedDoc = tr.dataset.id; drawDocs(); }));
    drawInspector();
  }

  function drawInspector() {
    const d = DOCS.find(x => x.id === state.selectedDoc) || DOCS[0];
    const chunks = E.INDEX.chunks.filter(c => c.doc.id === d.id);
    const box = $('#inspector');
    if (!roleCan(d)) {
      box.innerHTML = `<div class="card-head"><div><h2>${esc(d.title)}</h2><p>${d.id} · ${esc(d.type)}</p></div><span class="badge badge-accent">${icon('lock', 'ic-sm')} Restricted</span></div>
        <div class="card-body"><div class="callout">${icon('lock')}<div>This document is open to <b>${esc(accessText(d))}</b> only. You are viewing as ${ROLES[state.role]}, so its chunks are removed before search and never reach the answer. Switch the role in the top bar to compare.</div></div></div>`;
      return;
    }
    const meta = { doc_id: d.id, title: d.title, type: d.type, roles: d.roles, sensitivity: d.sensitivity, updated: d.updated, chunks: chunks.length, concepts: [...new Set(chunks.flatMap(c => c.concepts))], instance_types: [...new Set(chunks.flatMap(c => c.skus))] };
    box.innerHTML = `
      <div class="card-head"><div><h2>${esc(d.title)}</h2><p>${d.id} · ${esc(d.type)} · open to ${esc(accessText(d))}</p></div><span class="badge badge-primary">${chunks.length} chunks</span></div>
      <div class="card-body">
        ${chunks.map(c => `<div class="chunk"><div class="chunk-head"><span>Chunk ${c.n} · ${c.len} index terms</span><span>${c.concepts.map(x => `<span class="badge">${x}</span>`).join(' ')}</span></div>
          ${markEntities(c.text, c.ents).replace(/\[([A-Z_]+)\]/g, '<span class="redacted">[$1]</span>')}</div>`).join('')}
        <div style="margin-top:12px">${legendHtml()}</div>
        <details class="prompt" style="margin-top:10px"><summary>Metadata stored with each chunk</summary><pre class="json">${esc(JSON.stringify(meta, null, 2))}</pre></details>
      </div>`;
  }

  /* =================================================================
     Page 5. Onboarding: role-based 30-day path, flashcards and quiz
     ================================================================= */
  const PATHS = {
    se: [
      { week: 'Week 1 · Core services', tasks: [['Learn the 18 core Nimbus service names', '#/translator'], ['Finish the Core Services course', null], ['Set up your sandbox account', null], ['Read the NES overview', '#/kb?doc=D01']] },
      { week: 'Week 2 · Compute and storage', tasks: [['Learn the four NES instance families', '#/kb?doc=D02'], ['Size three sample migrations in Spec Matcher', '#/spec'], ['Read about the NOS storage tiers', '#/kb?doc=D08']] },
      { week: 'Week 3 · Customers', tasks: [['Read the AWS migration playbook', '#/kb?doc=D24'], ['Shadow two customer calls', null], ['Build a demo in the sandbox account', null]] },
      { week: 'Week 4 · Commercials', tasks: [['Read the discount approval policy', '#/kb?doc=D21'], ['Pass the service-name quiz on this page', null], ['Present a mock solution to your mentor', null]] }
    ],
    support: [
      { week: 'Week 1 · Core services', tasks: [['Learn the 18 core Nimbus service names', '#/translator'], ['Read the NES overview', '#/kb?doc=D01'], ['Set up your sandbox account', null]] },
      { week: 'Week 2 · Operations', tasks: [['Read the NES host failure runbook', '#/kb?doc=D25'], ['Learn Nimbus Watch alarms', '#/kb?doc=D18'], ['Shadow three support tickets', null]] },
      { week: 'Week 3 · Customers', tasks: [['Read the SLA reference', '#/kb?doc=D28'], ['Handle a Severity 3 ticket with a mentor', null]] }
    ],
    am: [
      { week: 'Week 1 · Core services', tasks: [['Learn the 18 core Nimbus service names', '#/translator'], ['Read the regions reference', '#/kb?doc=D26'], ['Meet your solutions engineer', null]] },
      { week: 'Week 2 · Commercials', tasks: [['Read the discount approval policy', '#/kb?doc=D21'], ['Read the POC credits policy', '#/kb?doc=D22'], ['Fill in an account plan', '#/kb?doc=D27']] }
    ]
  };
  function taskState() {
    if (!state.tasks) state.tasks = { se: { 'se-0-0': true, 'se-0-1': true, 'se-0-2': true, 'se-0-3': true, 'se-1-0': true }, support: { 'support-0-0': true }, am: {} };
    return state.tasks[state.role] || (state.tasks[state.role] = {});
  }
  function progress() {
    const done = taskState();
    const all = PATHS[state.role].flatMap((w, wi) => w.tasks.map((_, ti) => `${state.role}-${wi}-${ti}`));
    return { done: all.filter(id => done[id]).length, total: all.length };
  }

  // small seeded random generator so the quiz is the same on every load
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeQuiz(seed) {
    const rand = rng(seed);
    const pick = arr => arr[Math.floor(rand() * arr.length)];
    const pool = [...CONCEPTS].sort(() => rand() - 0.5).slice(0, 5);
    return pool.map(c => {
      const p = pick(['aws', 'azure', 'gcp']);
      const wrong = CONCEPTS.filter(x => x.id !== c.id).sort(() => rand() - 0.5).slice(0, 3).map(x => x.nimbus.name);
      return { q: `Which Nimbus service matches ${c[p].name} (${PROVIDERS[p]})?`, answer: c.nimbus.name, options: [c.nimbus.name, ...wrong].sort(() => rand() - 0.5), chosen: null };
    });
  }

  function renderOnboarding() {
    const pr = progress();
    const R = 34, C = 2 * Math.PI * R, share = pr.total ? pr.done / pr.total : 0;
    if (!state.quiz) state.quiz = makeQuiz(20261020);
    const done = taskState();
    main.innerHTML = `
      <div class="page-head"><div><h1>Onboarding path</h1><p class="sub">A 30-day plan for ${ROLES[state.role]}s. Tasks link straight to the right tool or document.</p></div></div>
      <div class="grid g-main-side">
        <div class="card">
          <div class="card-head">
            <div class="ring-wrap">
              <svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="${pr.done} of ${pr.total} tasks done">
                <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="8"/>
                <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--primary-600)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - share)}" transform="rotate(-90 42 42)"/>
                <text x="42" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">${pct(share)}</text>
              </svg>
              <div><h2>${pr.done} of ${pr.total} tasks done</h2><p>Day 9 of 30 · mentor check-in on Thursday</p></div>
            </div>
          </div>
          <div class="card-body">
            ${PATHS[state.role].map((w, wi) => `
              <div class="week"><div class="week-head"><b>${w.week}</b><span class="small muted">${w.tasks.filter((_, ti) => done[`${state.role}-${wi}-${ti}`]).length}/${w.tasks.length}</span></div>
                ${w.tasks.map(([t, href], ti) => { const id = `${state.role}-${wi}-${ti}`; return `
                  <label class="task${done[id] ? ' done' : ''}"><input type="checkbox" data-id="${id}" ${done[id] ? 'checked' : ''}><span class="t">${esc(t)}</span>${href ? `<a class="link" href="${href}">Open ${icon('chevron', 'ic-sm')}</a>` : ''}</label>`; }).join('')}
              </div>`).join('')}
          </div>
        </div>
        <div class="stack">
          <div class="card"><div class="card-head"><div><h2>Term of the day</h2><p>Click the card to flip it.</p></div><button class="btn btn-sm" id="nextTerm">Next ${icon('chevron', 'ic-sm')}</button></div>
            <div class="card-body"><div class="flash" id="flash"></div></div></div>
          <div class="card"><div class="card-head"><div><h2>Service-name quiz</h2><p>Five questions made from the glossary.</p></div><button class="btn btn-sm" id="newQuiz">${icon('refresh', 'ic-sm')} New quiz</button></div>
            <div class="card-body" id="quiz"></div></div>
        </div>
      </div>`;
    $$('.task input').forEach(cb => cb.addEventListener('change', () => {
      taskState()[cb.dataset.id] = cb.checked;
      store.set('tasks', state.tasks);
      updateNavProgress();
      renderOnboarding();
    }));
    $('#nextTerm').addEventListener('click', () => { state.flashIdx = (state.flashIdx + 1) % CONCEPTS.length; state.flashBack = false; drawFlash(); });
    $('#flash').addEventListener('click', () => { state.flashBack = !state.flashBack; drawFlash(); });
    $('#newQuiz').addEventListener('click', () => { state.quiz = makeQuiz(Date.now() & 0xffff); drawQuiz(); });
    drawFlash();
    drawQuiz();
  }
  function drawFlash() {
    const c = CONCEPTS[state.flashIdx];
    $('#flash').innerHTML = state.flashBack
      ? `<span class="small muted">In Nimbus Cloud</span><div class="big">${esc(c.nimbus.name)}</div><p class="small">${esc(c.plain)}</p><p class="small muted">${esc(c.watch)}</p>`
      : `<span class="small muted">${esc(c.category)}</span><div class="big">${esc(c.aws.name)}</div><p class="small muted">Azure: ${esc(c.azure.name)} · Google Cloud: ${esc(c.gcp.name)}</p><p class="small">What is it called at Nimbus?</p>`;
  }
  function drawQuiz() {
    const quiz = state.quiz;
    const answered = quiz.filter(x => x.chosen).length, right = quiz.filter(x => x.chosen === x.answer).length;
    $('#quiz').innerHTML = quiz.map((x, qi) => `
      <div style="margin-bottom:14px"><div class="quiz-q">${qi + 1}. ${esc(x.q)}</div><div class="quiz-opts">
        ${x.options.map(o => `<button class="quiz-opt${x.chosen ? (o === x.answer ? ' right' : o === x.chosen ? ' wrong' : '') : ''}" data-q="${qi}" data-o="${esc(o)}" ${x.chosen ? 'disabled' : ''}>${esc(o)}</button>`).join('')}
      </div></div>`).join('') + `<p class="small muted">${answered ? `Score: ${right} of ${answered}` : 'Pick an answer to start.'}</p>`;
    $$('.quiz-opt').forEach(b => b.addEventListener('click', () => { quiz[+b.dataset.q].chosen = b.dataset.o; drawQuiz(); }));
  }
  function updateNavProgress() { const pr = progress(); $('#navProgress').textContent = `${pr.done}/${pr.total}`; }

  /* =================================================================
     Page 6. Evaluation: offline test on the demo question set
     ================================================================= */
  function renderEval(params) {
    main.innerHTML = `
      <div class="page-head"><div><h1>Evaluation</h1><p class="sub">An offline test of retrieval on ${TEST_SET.length} demo questions. Each question has one document that holds the answer.</p></div>
        <div class="head-actions"><button class="btn btn-primary" id="runEval">${icon('play', 'ic-sm')} Run evaluation</button></div></div>
      <div class="callout" style="margin-bottom:16px">${icon('info')}<div>${TEST_SET.filter(t => t.type === 'cross').length} questions use AWS, Azure or Google Cloud words (cross-vocabulary) and ${TEST_SET.filter(t => t.type === 'same').length} use Nimbus words (same-vocabulary). The set is small and synthetic, so it checks that the pipeline works; it is not proof of real-world accuracy.</div></div>
      <div id="evalOut"><div class="card empty">${icon('chart')}<p style="margin-top:8px">Press “Run evaluation” to score the three retrieval settings.</p></div></div>
      <div class="card" style="margin-top:16px">
        <div class="card-head"><div><h2>Planned evaluation for the full system</h2><p>Each part is measured on its own, then the whole answer.</p></div></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Part</th><th>Metric</th><th>In plain words</th><th>Target</th></tr></thead><tbody>
          <tr><td>Intent classifier</td><td>Macro F1</td><td>Is the question type right, averaged over all types?</td><td>≥ 0.90</td></tr>
          <tr><td>Entity recogniser</td><td>Entity-level F1</td><td>Are product names found with the right label and edges?</td><td>≥ 0.92</td></tr>
          <tr><td>Entity linking</td><td>Accuracy</td><td>Is each name tied to the right Nimbus concept?</td><td>≥ 0.95</td></tr>
          <tr><td>Retrieval</td><td>Recall@5, MRR</td><td>Is the right document in the top 5, and how high?</td><td>≥ 0.90, ≥ 0.80</td></tr>
          <tr><td>Answer</td><td>Faithfulness</td><td>Is every claim supported by the cited text?</td><td>≥ 0.95</td></tr>
          <tr><td>Answer</td><td>Correctness (human review)</td><td>Would a senior engineer accept the answer?</td><td>≥ 85%</td></tr>
          <tr><td>Safety</td><td>Abstain rate on unanswerable questions</td><td>Does it say “not found” instead of guessing?</td><td>≥ 90%</td></tr>
          <tr><td>System</td><td>p95 latency</td><td>How long the slowest 5% of answers take</td><td>≤ 5 s</td></tr>
        </tbody></table></div>
      </div>`;
    $('#runEval').addEventListener('click', () => { state.evalResult = E.evaluate(); drawEval(); toast('Evaluation finished'); });
    if (params.get('run')) { history.replaceState(null, '', '#/eval'); state.evalResult = E.evaluate(); }
    if (state.evalResult) drawEval();
  }

  function drawEval() {
    const { rows, summary } = state.evalResult;
    const [A, B, C] = summary;
    const short = ['A · BM25 only', 'B · + linking & rewrite', 'C · + entity ranking'];
    const tile = (label, value, hint) => `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`;
    const rk = v => v === null ? '<span class="rank miss">miss</span>' : `<span class="rank${v === 1 ? ' r1' : ''}">${v}</span>`;
    $('#evalOut').innerHTML = `
      <div class="grid g-4" style="margin-bottom:16px">
        ${tile('Cross-vocabulary Recall@1', `${fix(A.cross.r1, 2)} → ${fix(B.cross.r1, 2)}`, 'from A to B')}
        ${tile('All questions Recall@3', `${fix(A.all.r3, 2)} → ${fix(C.all.r3, 2)}`, 'from A to C')}
        ${tile('All questions MRR', `${fix(A.all.mrr, 2)} → ${fix(C.all.mrr, 2)}`, 'from A to C')}
        ${tile('Test questions', TEST_SET.length, `${TEST_SET.filter(t => t.type === 'cross').length} cross · ${TEST_SET.filter(t => t.type === 'same').length} same vocabulary`)}
      </div>
      <div class="grid g-2">
        <div class="card"><div class="card-head"><div><h2>Recall@1 by setting</h2><p>Share of questions where the right document is ranked first.</p></div></div>
          <div class="card-body"><div class="legend" style="margin-bottom:8px"><span><i style="background:var(--series-1)"></i>Cross-vocabulary</span><span><i style="background:var(--series-2)"></i>Same-vocabulary</span></div>
            <div class="chart-box" id="evalChart"></div></div></div>
        <div class="card"><div class="card-head"><div><h2>Summary table</h2><p>The same numbers as the chart, plus Recall@3 and MRR.</p></div></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>Setting</th><th class="num">R@1</th><th class="num">R@3</th><th class="num">MRR</th><th class="num">Cross R@1</th><th class="num">Same R@1</th></tr></thead><tbody>
            ${summary.map((s, i) => `<tr><td>${short[i]}</td><td class="num">${fix(s.all.r1)}</td><td class="num">${fix(s.all.r3)}</td><td class="num">${fix(s.all.mrr)}</td><td class="num">${fix(s.cross.r1)}</td><td class="num">${fix(s.same.r1)}</td></tr>`).join('')}
          </tbody></table></div>
          <div class="card-body small muted">Recall@k: the right document is in the top k. MRR: the average of 1 / rank of the right document (1.0 = always first).</div></div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Rank of the right document, per question</h2><p>“miss” means it did not appear at all.</p></div></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Question</th><th>Type</th><th>Answer in</th><th class="num">A</th><th class="num">B</th><th class="num">C</th></tr></thead><tbody>
          ${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.q)}</td><td><span class="badge ${r.type === 'cross' ? 'badge-primary' : ''}">${r.type}</span></td><td>${r.gold}</td><td class="num">${rk(r.ranks.bm25)}</td><td class="num">${rk(r.ranks.rewrite)}</td><td class="num">${rk(r.ranks.full)}</td></tr>`).join('')}
        </tbody></table></div></div>`;
    drawBarChart($('#evalChart'), short, [
      { name: 'Cross-vocabulary', color: 'var(--series-1)', values: summary.map(s => s.cross.r1) },
      { name: 'Same-vocabulary', color: 'var(--series-2)', values: summary.map(s => s.same.r1) }
    ]);
  }

  // Grouped bar chart in plain SVG with hover tooltips
  function drawBarChart(el, groups, series) {
    const W = 560, H = 250, m = { t: 22, r: 8, b: 34, l: 36 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const band = iw / groups.length, bw = 24, gap = 2;
    const y = v => m.t + ih * (1 - v);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recall at 1 by retrieval setting">`;
    [0, 0.25, 0.5, 0.75, 1].forEach(t => { svg += `<line class="grid-line" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><g class="axis"><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${t.toFixed(2)}</text></g>`; });
    groups.forEach((g, gi) => {
      const x0 = m.l + gi * band + band / 2 - (series.length * bw + (series.length - 1) * gap) / 2;
      series.forEach((s, si) => {
        const v = s.values[gi], x = x0 + si * (bw + gap), top = y(v), base = y(0), r = Math.min(4, base - top);
        const d = `M${x},${base} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${base} Z`;
        svg += `<path d="${d}" fill="${s.color}"/><rect x="${x - 6}" y="${m.t}" width="${bw + 12}" height="${ih}" fill="transparent" data-tip="${esc(g)} · ${esc(s.name)}: ${v.toFixed(3)}"/>`;
        svg += `<text class="val" x="${x + bw / 2}" y="${top - 6}" text-anchor="middle">${v.toFixed(2)}</text>`;
      });
      svg += `<g class="axis"><text x="${m.l + gi * band + band / 2}" y="${H - 10}" text-anchor="middle">${esc(g)}</text></g>`;
    });
    el.innerHTML = svg + '</svg><div class="chart-tip"></div>';
    const tip = el.querySelector('.chart-tip');
    el.querySelectorAll('[data-tip]').forEach(rect => {
      rect.addEventListener('mousemove', e => {
        const b = el.getBoundingClientRect();
        tip.textContent = rect.dataset.tip;
        tip.style.left = `${Math.min(e.clientX - b.left + 12, b.width - tip.offsetWidth - 4)}px`;
        tip.style.top = `${e.clientY - b.top - 34}px`;
        tip.style.opacity = 1;
      });
      rect.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
    });
  }

  /* =================================================================
     Page 7. Trust & Safety: guardrails, model card, audit log
     ================================================================= */
  // A few typical questions, so the audit log can be shown before anyone has asked
  const SAMPLE_SESSION = ['What is our equivalent of an AWS EC2 m5.2xlarge?', 'Do we have something like S3 Glacier for cheap archive?', 'How much does a Redshift node cost in Nimbus?', 'How much POC credit can a new customer get?'];

  function renderTrust(params) {
    if (params && params.get('demo') && !state.audit.length) { SAMPLE_SESSION.forEach(q => ask(q, true)); state.chat[0].feedback = 'up'; state.audit[state.audit.length - 1].feedback = 'up'; history.replaceState(null, '', '#/trust'); }
    const S = state.settings;
    const setting = (key, title, desc, locked) => `
      <div class="setting"><div><div class="t">${title}${locked ? ` <span class="badge badge-outline">${icon('lock', 'ic-sm')} policy</span>` : ''}</div><div class="d">${desc}</div></div>
        <label class="toggle"><input type="checkbox" data-key="${key}" ${locked || S[key] ? 'checked' : ''} ${locked ? 'disabled' : ''} aria-label="${title}"><span></span></label></div>`;
    main.innerHTML = `
      <div class="page-head"><div><h1>Trust &amp; Safety</h1><p class="sub">The rules that keep answers grounded, private and fair. Changes apply to new questions on the Ask page.</p></div></div>
      <div class="grid g-2">
        <div class="card"><div class="card-head"><div><h2>Guardrails</h2><p>Switch a rule off to see what changes in the trace.</p></div></div>
          <div class="card-body" style="padding-top:4px;padding-bottom:4px">
            ${setting('grounded', 'Answer only from sources', 'If the evidence is weak or a price is missing, say so instead of guessing.')}
            ${setting('numberCheck', 'Check numbers against sources', 'Every number in an answer must appear in a cited document or the question.')}
            ${setting('roleFilter', 'Role-based access filter', 'Chunks a role may not read are removed before search, not after.')}
            ${setting('freshness', 'Show source dates and age warnings', `Sources older than ${E.STALE_DAYS} days are flagged so people check them.`)}
            ${setting('redact', 'Redact personal data before indexing', 'E-mails, phone numbers, keys and names are replaced with tags.', true)}
            ${setting('local', 'Keep data inside the company network', 'All models run on internal servers. No document text is sent to outside APIs.', true)}
          </div></div>
        <div class="card"><div class="card-head"><div><h2>Model and data card</h2><p>What runs where, and why it was chosen.</p></div></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>Part</th><th>Model or method</th><th>Why</th></tr></thead><tbody>
            <tr><td>Intent</td><td>DistilBERT, fine-tuned</td><td>Small and fast; good enough for 6 classes</td></tr>
            <tr><td>Entities</td><td>spaCy EntityRuler + BERT NER</td><td>Rules are exact for known names; the model finds new ones</td></tr>
            <tr><td>Embeddings</td><td>bge-small-en-v1.5</td><td>Strong retrieval for its size; runs on CPU</td></tr>
            <tr><td>Keyword search</td><td>BM25</td><td>Exact matches for codes like nx-gp3-8x32</td></tr>
            <tr><td>Reranker</td><td>bge-reranker-base</td><td>Reads question and chunk together for a better order</td></tr>
            <tr><td>Generator</td><td>Llama 3.1 8B Instruct</td><td>Open weights, so it can run on internal GPUs</td></tr>
            <tr><td>Redaction</td><td>Presidio + rules</td><td>Removes personal data before indexing</td></tr>
          </tbody></table></div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-head"><div><h2>Audit log (this session)</h2><p>Stored with a pseudonymous ID, kept 30 days, used only to improve answers, never for performance reviews.</p></div>${state.audit.length ? `<span class="badge">${state.audit.length} entries</span>` : `<button class="btn btn-sm" id="loadDemo">${icon('play', 'ic-sm')} Load sample session</button>`}</div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Question (redacted)</th><th>Intent</th><th>Sources</th><th>Confidence</th><th>Feedback</th></tr></thead><tbody>
          ${state.audit.length ? state.audit.map(a => `<tr><td class="small">${a.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td><td class="mono small">${USER_ID}</td><td class="small">${ROLES[a.role]}</td><td>${esc(a.q)}</td><td class="small">${a.intent}</td><td class="small">${a.sources.join(', ') || '–'}</td><td class="small">${a.confidence}</td><td class="small">${a.feedback === 'up' ? 'Helpful' : a.feedback === 'down' ? 'Not helpful' : '–'}</td></tr>`).join('')
            : '<tr><td colspan="8" class="empty">No questions yet in this session. Ask something on the Ask page.</td></tr>'}
        </tbody></table></div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Known limits of this prototype</h2></div></div>
        <div class="card-body small" style="line-height:1.7">
          All documents are synthetic, and Nimbus Cloud is a fictional provider. The intent model is a keyword stand-in, answers are written by templates, and dense retrieval and reranking are not run in the browser. Spec matching only compares vCPU, memory and GPU count; it does not compare CPU generation, network or disk speed.
        </div></div>`;
    if ($('#loadDemo')) $('#loadDemo').addEventListener('click', () => renderTrust(new URLSearchParams('demo=1')));
    $$('.setting input[data-key]').forEach(cb => cb.addEventListener('change', () => {
      state.settings[cb.dataset.key] = cb.checked;
      store.set('settings', state.settings);
      toast(`${cb.closest('.setting').querySelector('.t').textContent.trim()}: ${cb.checked ? 'on' : 'off'}`);
    }));
  }

  /* =================================================================
     Shell: routing, role switcher, theme, global search
     ================================================================= */
  const PAGES = { ask: renderAsk, translator: renderTranslator, spec: renderSpec, kb: renderKB, onboarding: renderOnboarding, eval: renderEval, trust: renderTrust };
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const [name, qs] = h.split('?');
    const page = PAGES[name] ? name : 'ask';
    state.page = page;
    $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
    $('#sidebar').classList.remove('open');
    PAGES[page](new URLSearchParams(qs || ''));
    window.scrollTo(0, 0);
  }

  function init() {
    $('#indexInfo').textContent = `${E.INDEX.chunks.length} chunks · built ${E.INDEX_DATE}`;
    $('#roleSel').value = state.role;
    $('#roleSel').addEventListener('change', e => {
      state.role = e.target.value;
      store.set('role', state.role);
      updateNavProgress();
      toast(`Viewing as ${ROLES[state.role]}. Search follows this role’s access rules.`);
      if (state.page !== 'ask') route(); else renderTrace();
    });
    $('#globalSearch').addEventListener('submit', e => {
      e.preventDefault();
      const q = $('#globalInput').value.trim();
      if (!q) return;
      $('#globalInput').value = '';
      if (state.page === 'ask') ask(q); else location.hash = '#/ask?q=' + encodeURIComponent(q);
    });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); $('#globalInput').focus(); }
    });
    const saved = store.get('theme', null);
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const themeIcon = () => { $('#themeBtn').innerHTML = icon(isDark() ? 'sun' : 'moon'); };
    themeIcon();
    $('#themeBtn').addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      store.set('theme', next);
      themeIcon();
    });
    $('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
    updateNavProgress();
    window.addEventListener('hashchange', route);
    route();
  }
  init();
})();
</script>
</body>
</html>
